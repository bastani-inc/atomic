initialize:
  - name: Install Node.js
    uses: github.com/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
    with:
      node-version: "22"
      package-manager-cache: "false"
  - name: Install Bun
    uses: github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    with:
      bun-version: "1.4.4"
  - name: Install the Rust toolchain
    uses: github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
    with:
      toolchain: stable
maintenance:
  - name: Install dependencies
    run: npm install --ignore-scripts
  - name: Build
    run: npm run build
knowledge:
  - name: lint
    contents: |
      Run `npm run check`: biome, the `bun check` typecheck passes and the published-shrinkwrap check.
      It needs Bun >= 1.4.4 on PATH. `npm run typecheck` runs the typecheck passes alone, and
      `npm run format` applies biome's formatting.
  - name: test
    contents: |
      Root suites run under vitest: `npm run test:unit`, `npm run test:integration`, or both with
      `npm run test:all`. The coding-agent suite is `npm run test --workspace=@bastani/atomic`, and the
      scripts/*.test.mjs tests run with `npm run test:scripts` (`node --test`). Build first: several
      suites load the built packages.
  - name: build
    contents: |
      `npm run build` (scripts/build.mjs) builds @bastani/pi-ai (fetching models.dev and the other
      provider catalogs), aliases @earendil-works/pi-ai onto it, builds the native N-API module and
      builds @bastani/atomic. It is incremental: each step is skipped while its inputs (sources,
      lockfile, toolchain version, relevant environment) and outputs match its stamp in
      node_modules/.cache/atomic-build, so a rebuild with nothing changed takes well under a second.
      The fetched model catalog snapshot is reused for 24 hours unless packages/ai changes.
      `npm run build -- --force` or `ATOMIC_BUILD_FORCE=1` rebuilds every step and refetches the
      catalog; CI (`CI` set) always builds in full.

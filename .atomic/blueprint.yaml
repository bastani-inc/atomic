initialize:
  - name: Install Node.js
    uses: github.com/actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
    with:
      node-version-file: package.json
      package-manager-cache: "false"
  - name: Install Bun
    uses: github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    with:
      bun-version: "1.4.5"
  - name: Install the Rust toolchain
    uses: github.com/dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
    with:
      toolchain: stable
maintenance:
  - name: Install dependencies
    run: npm install --ignore-scripts
  - name: Build
    run: npm run build
knowledge:
  - name: lint
    contents: |
      Run `npm run check`: biome, the `bun check` typecheck passes and the interactive event-loop check.
      It needs Bun >= 1.4.5 on PATH. `npm run typecheck` runs the typecheck passes alone, and
      `npm run format` applies biome's formatting. If a direct Git commit cannot find `prek`,
      use `PATH="$PWD/node_modules/.bin:$PATH" git commit ...` so the installed hook finds the local binary.
      Stage new API files, their tracked callers and their tests together: hooks hide unstaged tracked changes,
      but the full typecheck still discovers untracked TypeScript files.
  - name: test
    contents: |
      Root suites run under vitest: `npm run test:unit`, `npm run test:integration`, or both with
      `npm run test:all`. On macOS, `test/integration/task-process-tree-containment.test.ts` needs GNU
      `timeout` on PATH (Homebrew `coreutils`), as supplied by the manual macOS workflow.
      The coding-agent suite is `npm run test --workspace=@bastani/atomic`, and the scripts/*.test.mjs
      tests run with `npm run test:scripts` (`node --test`). The TUI package uses
      `npm run test --workspace=@bastani/atomic-tui` (`node --test`), not a Vitest config.
      Focused TUI tests run with `node --test packages/tui/test/<name>.test.ts`; the TUI workspace's
      npm test script always expands its full test glob, even when a filename is appended.
      Build first: several suites load the built packages. For focused root tests use
      `npm run test:unit -- test/unit/<file>.test.ts`; the test-suite-runner fixtures need npm's
      node_modules/.bin on PATH for their nested Vitest commands. For many test-file filters on Windows,
      invoke `node node_modules/vitest/vitest.mjs run --project unit ...` directly rather than `npx vitest`:
      npx.cmd passes through cmd.exe and fails once the command exceeds its 8191-character limit.
      Filter coding-agent tests with
      `npm run test --workspace=@bastani/atomic -- test/history-bounded.test.ts` (the package script
      already passes `--run`; run from its workspace, not the root with only `--config`). Run `test/http-dispatcher.test.ts`
      on Node 24.20.0 or later. Node 24.17.0 through 24.19.0 reject valid IPv6 proxy certificates.
      The TUI autocomplete suite's @ cases need `fd`
      on PATH; if the system provides `fdfind`, expose it as `fd` for that run so those cases do not skip.
      To select coding-agent files, run `cd packages/coding-agent && npx vitest run test/<name>.test.ts`;
      its config resolves `test/` from that working directory.
      For concurrent-session coverage, use
      `npm run test --workspace=@bastani/atomic -- agent-session-concurrent-` to select the five
      `.suite.ts` files; the `agent-session-concurrent.test.ts` wrapper is excluded.
      Finish `npm run check` and `npm run build` before running suites that import built packages:
      typechecking rebuilds dist in place and cleans provider data. To test a restored catalog without fetching,
      validate it with `npm run check:model-data --workspace=@bastani/atomic-ai`, then run `npm run check`
      and `npm run test --workspace=@bastani/atomic-ai`. Typecheck reuses valid generated data.
      Validate named-worktree permissions with a private default umask:
      `(umask 0022; npx --no-install vitest --run --project unit test/unit/subagents-named-worktree-locks.test.ts)`.
      Localized named-worktree recovery fixtures write the translated marker while Git is paused, so they do not
      require installed locales or a Git build with gettext support.
      Check terminal-display regressions on the oldest supported Node runtime, 24.20.0, too; newer Node versions can hide
      control-sequence stripping differences. If the local Node is newer, run
      `npm exec --yes --package=node@24.20.0 -- node node_modules/vitest/vitest.mjs run --project unit test/unit/<file>.test.ts`.
      After changing SDK imports used by workflow graph views, run
      `npx vitest run --project unit test/unit/overlay-adapter-autowrap.test.ts test/unit/overlay-adapter-hidden-render.test.ts`:
      these wrappers run Bun children with isolated module mocks, which must expose each imported SDK name.
      Verify both localized recovery fixtures without system locales with:
      `(umask 022; LOCPATH=/nonexistent npx vitest run --project unit test/unit/subagents-named-worktree-locks.test.ts test/unit/subagents-named-worktree-recovery.test.ts)`.
      Before real CLI captures, run `npm run build`; `npm run check` does not refresh the compiled CLI's
      builtin assets. Exercise `/tasks` and stage chats too: direct component tests do not cover RPC-hosted
      widget renderer resolution.
      SDK tests that allocate an agentDir and load bundled packages call `linkSharedTranspileCache(agentDir)`
      from `packages/coding-agent/test/helpers/shared-transpile-cache.ts` to reuse the suite's warmed compilation cache;
      keep cold-cache coverage separate.
      Measure task-list key-to-paint latency with `bun run scripts/perf/tasks-board/benchmark.ts 100,1000,10000 30`.
      For isolated CLI UI checks, set ATOMIC_CODING_AGENT_DIR to a fresh temporary profile and pass
      --offline. ATOMIC_AGENT_DIR does not select the CLI profile.
      Bare Node type stripping does not resolve source .js import paths to .ts. Node child probes that
      import source modules use the resolution hook shown in packages/coding-agent/test/read-streaming.test.ts.
      Run the Darwin zombie process-group fixtures with
      `cargo test --locked -p atomic-natives --lib externally_terminated_group`, or dispatch
      `macos-tests.yml` with `project=native` and `tests=externally_terminated_group`.
  - name: worktrees
    contents: |
      Set up a linked Git worktree with `node scripts/worktree-setup.mjs` from inside it (`--no-build` skips the
      final `npm run build`). With a lockfile matching the main checkout's, it makes `node_modules` and each
      `packages/*/node_modules` real directories of absolute links to the main checkout's packages, recreates the
      `@bastani/*` workspace links and `.bin` entries so they point into the worktree, copies `vitest`, and keeps
      `.cache`, `.vite` and `.vite-temp` per worktree. Otherwise it runs `npm ci --ignore-scripts` in the worktree.
      Never link the whole `node_modules` to another checkout: `@bastani/atomic` would resolve to that checkout's
      build, so child-process tests would test the wrong code, and Vitest 4 (whose files would then sit outside the
      project root) fails bare imports such as `string_decoder` or `stream` with
      "Cannot find module '<worktree>/string_decoder'" when the worktree path has a matching length.
      `test/global-setup-workspace-links.ts` stops the root and coding-agent suites in a worktree set up that way.
  - name: readme feature tables
    contents: |
      After changing scripts/readme-feature-wall/manifest.json, run
      `node scripts/readme-feature-wall/build-readme.mjs` to regenerate the README tables.
      `node scripts/readme-feature-wall/build-readme.mjs --check` checks that they match.
  - name: build
    contents: |
      `npm run build` (scripts/build.mjs) builds the forked pi packages in dependency order
      (@bastani/atomic-schema, -telemetry, -ai, fetching models.dev and the other provider catalogs,
      then -tui, -agent-core and -codemode), builds the native N-API module and builds @bastani/atomic. It is incremental: each step is skipped while its inputs (sources,
      lockfile, toolchain version, relevant environment) and outputs match its stamp in
      node_modules/.cache/atomic-build, so a rebuild with nothing changed takes well under a second.
      The fetched model catalog snapshot is reused for 24 hours unless packages/ai changes.
      `npm run build -- --force` or `ATOMIC_BUILD_FORCE=1` rebuilds every step and refetches the
      catalog; CI (`CI` set) always builds in full.

maintenance:
  - name: Restore build cache (benchmark)
    run: if [ -n "${BENCH_BUILD_CACHE:-}" ] && [ -f "$BENCH_BUILD_CACHE" ]; then tar -I zstd -xf "$BENCH_BUILD_CACHE"; fi
  - name: Fetch crates
    run: cargo fetch --locked
  - name: Build
    run: cargo build --locked --workspace
knowledge:
  - name: test
    contents: Run `cargo test --workspace`.

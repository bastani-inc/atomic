name: Warm toolchain cache

# Populate the isolated Linux release dependency/toolchain volumes from trusted main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-toolchain-cache
  cancel-in-progress: true

jobs:
  release-linux-cache:
    name: Warm Linux release cache (${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # Keep Zig version and SHA-256 pins in sync with publish.yml.
      ZIG_VERSION: 0.16.0
      ZIG_SHA256_X86_64: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      ZIG_SHA256_AARCH64: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [nscloud-ubuntu-24.04-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-x64, nscloud-cache-allow-commit-from-main, nscloud-no-remote-builders, nscloud-runner-tool-cache-20gb]
            arch: x64
          - runner: [nscloud-ubuntu-24.04-arm64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-arm64, nscloud-cache-allow-commit-from-main, nscloud-no-remote-builders, nscloud-runner-tool-cache-20gb]
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mount Namespace Zig tarball cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          path: ~/.cache/atomic-zig
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Configure Namespace dependency cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Warm verified Zig tarball
        shell: bash
        timeout-minutes: 4
        env:
          ZIG_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ZIG_ARCH" in
            x64) arch=x86_64; sha="$ZIG_SHA256_X86_64" ;;
            arm64) arch=aarch64; sha="$ZIG_SHA256_AARCH64" ;;
            *) echo "Unsupported Zig architecture: $ZIG_ARCH"; exit 1 ;;
          esac
          file="zig-${arch}-linux-${ZIG_VERSION}.tar.xz"
          cache="$HOME/.cache/atomic-zig"
          mkdir -p "$cache"
          if [[ -f "$cache/$file" ]] && echo "$sha  $cache/$file" | sha256sum -c --status; then
            echo "Zig $ZIG_VERSION already verified on the Namespace release volume"
            exit 0
          fi
          tmp="$(mktemp "$cache/.${file}.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          # Try shuffled community mirrors before the official download endpoint.
          mirrors="$(curl -fsSL --connect-timeout 5 --max-time 10 https://ziglang.org/download/community-mirrors.txt || true)"
          mapfile -t urls < <(printf '%s\n' "$mirrors" | sed '/^$/d' | shuf | head -n 3)
          urls+=("https://ziglang.org/download/$ZIG_VERSION")
          for base in "${urls[@]}"; do
            echo "Downloading $file from $base"
            if curl -fsSL --connect-timeout 10 --max-time 45 -o "$tmp" "${base%/}/$file?source=atomic-release-cache" &&
              echo "$sha  $tmp" | sha256sum -c --status; then
              mv -f "$tmp" "$cache/$file"
              echo "Zig $ZIG_VERSION verified and persisted on the Namespace release volume"
              exit 0
            fi
            echo "Zig download failed or SHA-256 mismatch from $base"
          done
          echo "Could not download a verified Zig $ZIG_VERSION tarball" >&2
          exit 1

  msvc-crt:
    name: Warm MSVC CRT ${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    # Both Windows legs cross-compile on this Linux runner spec.
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 19
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      XWIN_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
    steps:
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
      # Built with glibc: the upstream musl release binary is allocator-bound and
      # took 9m56s to populate arm64 on this spec; the glibc build takes 35s.
      - name: Install cargo-xwin
        timeout-minutes: 3
        run: cargo install cargo-xwin --version 0.23.0 --locked
      - name: Resolve MSVC CRT cache directory
        shell: bash
        run: echo "XWIN_CACHE_DIR=$HOME/.cache/cargo-xwin" >> "$GITHUB_ENV"
      # The key epoch must match `publish.yml`.
      - name: Restore MSVC CRT and Windows SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-v1-${{ matrix.arch }}-17
      - name: Populate MSVC CRT cache on miss
        timeout-minutes: 8
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: cargo-xwin xwin cache xwin

  release-windows-cache:
    name: Warm Windows release cache
    if: github.ref == 'refs/heads/main'
    runs-on: [nscloud-windows-2022-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.windows-x64, nscloud-cache-allow-commit-from-main, nscloud-no-remote-builders, nscloud-runner-tool-cache-20gb]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Configure Namespace dependency cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - run: npm ci --ignore-scripts

name: Publish
run-name: Publish ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., 0.9.10 or 0.9.10-alpha.1)"
        required: true
        type: string
      source_ref:
        description: "Source ref to build/publish (defaults to tag; use only for release recovery)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
  PACKAGE_DIR: packages/coding-agent
  GLIBC_FLOOR: "2.17"
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  integrity:
    name: Verify release tag
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      npm-tag: ${{ steps.verify.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify tag commit identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.[1-9][0-9]*)?'
          [[ "$RELEASE_TAG" =~ ^$version_re$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse 'HEAD^{commit}')
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$sha" == "$tag_sha" ]] || { echo "Source ref does not resolve to tag commit $tag_sha" >&2; exit 1; }
          version=$(bun -e 'console.log((await Bun.file("packages/coding-agent/package.json").json()).version)')
          [[ "$version" == "$RELEASE_TAG" ]] || { echo "Package version $version does not match tag $RELEASE_TAG" >&2; exit 1; }
          subject=$(git show -s --format=%s HEAD)
          [[ "$subject" == "Release $RELEASE_TAG" ]] || { echo "Commit subject must be Release $RELEASE_TAG; found: $subject" >&2; exit 1; }
          npm_tag=latest
          [[ "$version" == *-alpha.* ]] && npm_tag=next
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

  native-artifacts:
    name: Native ${{ matrix.slug }}
    needs: integrity
    runs-on: ${{ matrix.runner }}
    # Job caps are hang detectors, sized per leg from the last eight releases.
    # The per-step `timeout-minutes` below are the stall detectors. See docs/ci.md.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      # cargo-xwin fetches both CRTs by default; each Windows leg links one.
      XWIN_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        # timeout_minutes caps the job; build_timeout_minutes caps each compile attempt.
        # A cap must contain every bounded recovery path, not the times a green run happened
        # to take: reserving only observed setup cancels the job mid-retry, which is the
        # failure this retry exists to survive. Each cap is therefore
        #   ceil(measured p100 setup, excluding steps reserved at their bound)
        #   + those steps' bounds + 2 x build_timeout_minutes + 1 upload.
        # Reserved at their bound: both zig attempts (2 + 2, linux) and the MSVC CRT
        # populate step (8, win32) whose measured cost is its cache-miss path.
        # win32 setup adds the measured 36s glibc cargo-xwin build to the old setup.
        # Upload is measured at <= 4s across legs and reserved at 1 minute.
        # linux-x64-gnu: ceil((46-18)s / 60)=1 + 4 + 2 x 5 + 1 = 16
        # linux-arm64-gnu: ceil((128-8)s / 60)=2 + 4 + 2 x 5 + 1 = 17
        # linux-x64-musl: ceil((107-3)s / 60)=2 + 4 + 2 x 5 + 1 = 17
        # linux-arm64-musl: ceil((142-5)s / 60)=3 + 4 + 2 x 5 + 1 = 18
        # darwin-x64: ceil(98s / 60)=2 + 2 x 8 + 1 = 19
        # darwin-arm64: ceil(26s / 60)=1 + 2 x 5 + 1 = 12
        # win32-x64-msvc: ceil((291-249+36)s / 60)=2 + 8 + 2 x 5 + 1 = 21
        # win32-arm64-msvc: ceil((384-343+36)s / 60)=2 + 8 + 2 x 5 + 1 = 21
        # `slug` is the napi platform id: it names the .node file, the npm leaf, and
        # this leg's artifact, so two legs that share platform+arch (glibc and musl
        # Linux) can never collide on an artifact name.
        include:
          - runner: [nscloud-ubuntu-24.04-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-x64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: linux
            arch: x64
            slug: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            timeout_minutes: 16
            build_timeout_minutes: 5
          - runner: [nscloud-ubuntu-24.04-arm64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-arm64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: linux
            arch: arm64
            slug: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            timeout_minutes: 17
            build_timeout_minutes: 5
          # musl legs reuse the same zig toolchain; @napi-rs/cli adds
          # `-C target-feature=-crt-static` for a musl ABI, which is what keeps the
          # produced .node a dlopen-able shared object instead of a static-CRT blob.
          - runner: [nscloud-ubuntu-24.04-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-x64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: linux
            arch: x64
            slug: linux-x64-musl
            target: x86_64-unknown-linux-musl
            timeout_minutes: 17
            build_timeout_minutes: 5
          - runner: [nscloud-ubuntu-24.04-arm64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-arm64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: linux
            arch: arm64
            slug: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            timeout_minutes: 18
            build_timeout_minutes: 5
          - { runner: [namespace-profile-atomic-release-macos-arm64-6x14, nscloud-cache-exp-do-not-commit], platform: darwin, arch: x64, slug: darwin-x64, target: x86_64-apple-darwin, timeout_minutes: 19, build_timeout_minutes: 8 }
          - { runner: [namespace-profile-atomic-release-macos-arm64-6x14, nscloud-cache-exp-do-not-commit], platform: darwin, arch: arm64, slug: darwin-arm64, target: aarch64-apple-darwin, timeout_minutes: 12, build_timeout_minutes: 5 }
          - runner: [nscloud-ubuntu-24.04-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-x64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: win32
            arch: x64
            slug: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            timeout_minutes: 21
            build_timeout_minutes: 5
          - runner: [nscloud-ubuntu-24.04-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.linux-x64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
            platform: win32
            arch: arm64
            slug: win32-arm64-msvc
            target: aarch64-pc-windows-msvc
            timeout_minutes: 21
            build_timeout_minutes: 5
    steps:
      # Release checkout does not use the Namespace git mirror.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # rustup needs the bare target; only the glibc Linux legs separately receive
      # the glibc-suffixed target consumed by cargo-zigbuild.
      - id: rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      # A rustup fetch that overruns the 4-minute cap is a network flake, not a
      # broken toolchain: 0.9.16-alpha.5 lost both of its publish runs to one.
      # The curl inside the action already retries, so only a second attempt on a
      # fresh step clock helps. Failing here wastes a whole release build.
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Prefer pinned rustup toolchain on macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Configure macOS release dependency cache
        if: matrix.platform == 'darwin'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - name: Configure Linux release dependency cache
        if: runner.os == 'Linux'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Resolve explicit native build target
        id: target
        shell: bash
        env:
          BARE_TARGET: ${{ matrix.target }}
        run: |
          # Only a glibc triple gets the floor suffix. build-native.ts routes
          # `<triple>.<major>.<minor>` straight to cargo-zigbuild's glibc pinning;
          # a musl triple must stay bare so it falls through to napi's
          # --cross-compile path, which is what applies -crt-static.
          build_target="$BARE_TARGET"
          [[ "$BARE_TARGET" != *-unknown-linux-gnu ]] || build_target="${BARE_TARGET}.${GLIBC_FLOOR}"
          echo "build-target=$build_target" >> "$GITHUB_OUTPUT"
      - name: Set baseline x64 CPU flags
        if: matrix.arch == 'x64'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-cpu=x86-64-v2' >> "$GITHUB_ENV"
      # Community Zig mirrors have stalled two releases (795.9s and 437.6s).
      # setup-zig applies no per-mirror deadline, so bound it and retry once on a
      # re-shuffled mirror list: a stall now costs at most 4 minutes and fails loudly.
      - name: Setup zig for portable Linux builds
        id: zig
        if: matrix.platform == 'linux'
        continue-on-error: true
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Namespace runners are ephemeral, so the tool cache dies with the VM.
          use-tool-cache: false
          # Global .zig-cache, not the tarball cache. Its save key embeds the run id,
          # so it can never be reused, and disabling it keeps the retry's post step inert.
          use-cache: false
      - name: Retry zig acquisition on a re-shuffled mirror list
        if: matrix.platform == 'linux' && steps.zig.outcome == 'failure'
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-tool-cache: false
          use-cache: false
      # Unversioned taiki-e tools resolve to @latest, floating the build toolchain
      # of a provenance-signed artifact with no diff.
      - name: Install cargo-zigbuild for portable Linux builds
        if: matrix.platform == 'linux'
        timeout-minutes: 3
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-zigbuild@0.23.0
      # Both Windows targets compile on x64 Ubuntu with its installed LLVM 18.
      # Avoid apt metadata/metapackage downloads; fail clearly on image drift.
      - name: Select installed Windows cross-compile tooling
        if: matrix.platform == 'win32'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          llvm_bin=/usr/lib/llvm-18/bin
          for tool in clang clang-cl lld-link llvm-ar llvm-lib llvm-dlltool llvm-ml; do
            test -x "$llvm_bin/$tool" || { echo "Missing LLVM 18 tool: $tool" >&2; exit 1; }
          done
          "$llvm_bin/clang" --version
          "$llvm_bin/lld-link" --version
          echo "$llvm_bin" >> "$GITHUB_PATH"
      # Built with glibc from crates.io: the upstream musl release binary is
      # allocator-bound and took 9m56s to populate the arm64 CRT on a 4x16 runner,
      # past the populate bound; the glibc build (36s) populates it in 35s.
      - name: Install cargo-xwin
        if: matrix.platform == 'win32'
        timeout-minutes: 3
        run: cargo install cargo-xwin --version 0.23.0 --locked
      # Pinned to a versioned subdirectory of the mounted cache volume so the
      # populate step and the build step agree regardless of XDG_CACHE_HOME.
      # Bump the `v1-17` epoch here and in warm-toolchain-cache.yml together to
      # force an SDK refresh; the trailing `17` is XWIN_VERSION, the Visual
      # Studio major version.
      - name: Resolve MSVC CRT cache directory
        if: matrix.platform == 'win32'
        shell: bash
        run: echo "XWIN_CACHE_DIR=$HOME/.cache/cargo-xwin/v1-17" >> "$GITHUB_ENV"
      # Bind-mounts ~/.cache/cargo-xwin onto the release cache volume this leg
      # already carries (nscloud-cache-tag-bastani-inc.atomic.release.linux-x64),
      # warmed by warm-toolchain-cache.yml. This leg keeps
      # nscloud-cache-exp-do-not-commit, so it never writes the volume back.
      - name: Configure MSVC CRT cache volume
        if: matrix.platform == 'win32'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          path: ~/.cache/cargo-xwin
      # cargo-xwin 0.23.0 trusts a DONE marker that names this arch without
      # re-checking the splat files it lists, and a cache volume can serve a
      # stale or partial fork (docs/ci.md, "Cache Volumes"). Treat a DONE hit
      # over a directory missing its splat output as a miss and start clean.
      - name: Detect partial MSVC CRT cache
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          set -euo pipefail
          xwin_dir="$XWIN_CACHE_DIR/xwin"
          done_file="$xwin_dir/DONE"
          if [[ -d "$xwin_dir" ]] && [[ -f "$done_file" ]] && head -n1 "$done_file" | grep -qw "$XWIN_ARCH"; then
            ok=1
            for required in "crt/include" "crt/lib/$XWIN_ARCH" "sdk/include" "sdk/include/ucrt" "sdk/lib/um/$XWIN_ARCH" "sdk/lib/ucrt/$XWIN_ARCH"; do
              if [[ ! -d "$xwin_dir/$required" ]] || [[ -z "$(ls -A "$xwin_dir/$required" 2>/dev/null)" ]]; then
                ok=0
                break
              fi
            done
            if [[ "$ok" -eq 0 ]]; then
              echo "Partial or stale MSVC CRT cache detected for $XWIN_ARCH; wiping $xwin_dir" >&2
              rm -rf "$xwin_dir"
            fi
          fi
      # Bounds a cold fetch: the glibc cargo-xwin populated arm64 in 35s on 4x16,
      # where the musl release binary took 7m41s (x64) and 9m56s (arm64).
      - name: Populate MSVC CRT cache on miss
        if: matrix.platform == 'win32'
        timeout-minutes: 8
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: cargo-xwin xwin cache xwin
      # The CRT fetch is hoisted above, so this is a compile: each budget is that
      # leg's measured p100 times at least 1.4.
      # A stalled compile consumes one bounded attempt; continue-on-error allows
      # exactly one fresh attempt, while its failure remains job-fatal.
      - name: Build native binding
        id: native_build
        continue-on-error: true
        timeout-minutes: ${{ matrix.build_timeout_minutes }}
        env:
          CROSS_TARGET: ${{ matrix.platform != 'darwin' && steps.target.outputs.build-target || '' }}
          NATIVE_TARGET: ${{ matrix.platform == 'darwin' && matrix.target || '' }}
          XWIN_ACCEPT_LICENSE: "1"
        run: bun run --cwd packages/natives build
      - name: Retry native binding
        if: steps.native_build.outcome == 'failure'
        timeout-minutes: ${{ matrix.build_timeout_minutes }}
        env:
          CROSS_TARGET: ${{ matrix.platform != 'darwin' && steps.target.outputs.build-target || '' }}
          NATIVE_TARGET: ${{ matrix.platform == 'darwin' && matrix.target || '' }}
          XWIN_ACCEPT_LICENSE: "1"
        run: bun run --cwd packages/natives build
      - name: Verify Rosetta for Intel macOS smoke
        if: matrix.slug == 'darwin-x64'
        shell: bash
        run: test "$(/usr/bin/arch -x86_64 /usr/bin/uname -m)" = x86_64
      - name: Select Intel Node for translated macOS smoke
        if: matrix.slug == 'darwin-x64'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: x64
          package-manager-cache: false
      - name: Install Intel smoke dependencies
        if: matrix.slug == 'darwin-x64'
        run: npm ci --ignore-scripts --cpu=x64
      - name: Load Intel native binding under Rosetta
        if: matrix.slug == 'darwin-x64'
        run: node -e "require('node:assert/strict').equal(process.arch, 'x64'); require('./packages/natives/native/atomic_natives.darwin-x64.node'); console.log('Intel native binding loaded under Rosetta')"
      - name: Prove scriptless PostgreSQL persistence on Linux and macOS
        if: matrix.platform == 'darwin' || endsWith(matrix.slug, '-gnu')
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.slug }}"
          target=${target%-gnu}
          probe="$RUNNER_TEMP/postgres-${{ matrix.slug }}"
          mkdir -p "$probe/source" "$probe/install"
          printf '{"name":"@bastani/atomic-natives","version":"0.0.0"}' > "$probe/source/package.json"
          node scripts/stage-postgres-runtime.mjs "$target" "$probe/source"
          npm pack "$probe/source" --ignore-scripts --pack-destination "$probe"
          npm install --prefix "$probe/install" "$probe"/*.tgz --ignore-scripts --offline --no-audit --no-fund
          node scripts/smoke-postgres-runtime.mjs "$probe/install/node_modules/@bastani/atomic-natives" "$target"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomic-natives-${{ matrix.slug }}
          path: packages/natives/native/*.node
          if-no-files-found: error
          retention-days: 14

  linux-binary-smoke:
    name: Smoke Linux binary
    needs: integrity
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
      - name: Build Linux x64 archive
        run: ./scripts/build-binaries.sh --skip-deps --platform linux-x64
      - name: Smoke Linux release archive
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/atomic-linux-smoke"
          mkdir -p "$smoke"
          tar -xzf packages/coding-agent/binaries/atomic-linux-x64.tar.gz -C "$smoke"
          "$smoke/atomic/atomic" --version
          bun run scripts/assert-builtin-set.ts "$smoke/atomic/builtin"
          for path in app.js native-modifiers.js image-resize-worker.js builtin/workflows/package.json builtin/subagents/package.json builtin/mcp/package.json builtin/web-access/package.json builtin/intercom/package.json node_modules/@bastani/atomic-natives/package.json node_modules/@bastani/atomic-natives/native/atomic_natives.linux-x64-gnu.node node_modules/@modelcontextprotocol/ext-apps/package.json node_modules/@mozilla/readability/package.json node_modules/@bastani/pi-ai/dist/models.generated.js node_modules/@bastani/pi-ai/dist/providers/data/.manifest.json node_modules/@bastani/pi-ai/dist/providers/data/amazon-bedrock.json node_modules/@bastani/pi-ai/dist/providers/data/anthropic.json node_modules/@bastani/pi-ai/dist/providers/data/kimi-coding.json node_modules/@bastani/pi-ai/dist/providers/data/openrouter.json node_modules/@bastani/pi-ai/dist/auth/oauth/kimi-coding.js node_modules/@bastani/pi-ai/dist/auth/oauth/openrouter.js node_modules/@bastani/pi-ai/dist/bun-oauth.js; do
            test -f "$smoke/atomic/$path" || { echo "Missing release archive path: $path" >&2; exit 1; }
          done
          node scripts/smoke-postgres-runtime.mjs "$smoke/atomic/node_modules/@bastani/atomic-natives" linux-x64
          mkdir -p "$RUNNER_TEMP/atomic-linux-cwd"
          set +e
          output=$(cd "$RUNNER_TEMP/atomic-linux-cwd" && printf '' | "$smoke/atomic/atomic" --no-session 2>&1)
          status=$?
          set -e
          echo "$output"
          if grep -q 'Failed to load extension' <<<"$output"; then
            exit 1
          fi
          [[ "$status" -eq 0 ]] || grep -Eq 'No models available|No model selected|No API key found' <<<"$output"

  # Bun 1.4.0 Windows bytecode executables must be compiled on a Windows host:
  # the same compile cross-run from Linux segfaults before user code runs. This
  # job therefore builds the release's actual Windows archives, smokes the x64
  # one, and hands both to the payload build, whose Linux leg skips Windows.
  windows-binary-smoke:
    name: Build and smoke Windows archives
    needs: [integrity, native-artifacts]
    runs-on: [nscloud-windows-2022-amd64-4x16-with-cache-with-builders, nscloud-cache-tag-bastani-inc.atomic.release.windows-x64, nscloud-cache-allow-commit-from-main, nscloud-cache-exp-do-not-commit, nscloud-no-remote-builders]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Configure Namespace dependency cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Download Windows native bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atomic-natives-win32-*
          path: packages/natives/native
          merge-multiple: true
      - name: Hydrate release model data
        run: npm run hydrate:model-data
      - name: Build Windows x64 archive
        shell: bash
        run: ./scripts/build-binaries.sh --skip-install --offline-model-data --platform windows-x64
      - name: Smoke Windows release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "atomic-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive packages/coding-agent/binaries/atomic-windows-x64.zip $smoke -Force
          $atomic = Join-Path $smoke "atomic.exe"
          & $atomic --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run scripts/assert-builtin-set.ts (Join-Path $smoke "builtin")
          foreach ($path in @("app.js", "native-modifiers.js", "image-resize-worker.js", "builtin/workflows/package.json", "builtin/subagents/package.json", "builtin/mcp/package.json", "builtin/web-access/package.json", "builtin/intercom/package.json", "node_modules/@bastani/atomic-natives/package.json", "node_modules/@bastani/atomic-natives/native/atomic_natives.win32-x64-msvc.node", "native/win32/prebuilds/win32-x64/win32-platform.node", "node_modules/@modelcontextprotocol/ext-apps/package.json", "node_modules/@mozilla/readability/package.json", "node_modules/@bastani/pi-ai/dist/models.generated.js", "node_modules/@bastani/pi-ai/dist/providers/data/.manifest.json", "node_modules/@bastani/pi-ai/dist/providers/data/amazon-bedrock.json", "node_modules/@bastani/pi-ai/dist/providers/data/anthropic.json", "node_modules/@bastani/pi-ai/dist/providers/data/kimi-coding.json", "node_modules/@bastani/pi-ai/dist/providers/data/openrouter.json", "node_modules/@bastani/pi-ai/dist/auth/oauth/kimi-coding.js", "node_modules/@bastani/pi-ai/dist/auth/oauth/openrouter.js", "node_modules/@bastani/pi-ai/dist/bun-oauth.js")) {
            if (-not (Test-Path (Join-Path $smoke $path))) { throw "Missing release archive path: $path" }
          }
          node scripts/smoke-postgres-runtime.mjs (Join-Path $smoke "node_modules/@bastani/atomic-natives") windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cwd = Join-Path $env:RUNNER_TEMP "atomic-windows-cwd"
          New-Item -ItemType Directory -Force -Path $cwd | Out-Null
          Push-Location $cwd
          $output = "" | & $atomic --no-session 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($output -match "Failed to load extension") { exit 1 }
          if ($status -ne 0 -and $output -notmatch "No models available|No model selected|No API key found") { exit $status }
      # build-binaries.sh clears its output directory on every run, so stash the
      # smoked x64 archive while the arm64 archive builds.
      - name: Build Windows arm64 archive
        shell: bash
        run: |
          mv packages/coding-agent/binaries/atomic-windows-x64.zip "$RUNNER_TEMP/atomic-windows-x64.zip"
          ./scripts/build-binaries.sh --skip-install --skip-package-build --offline-model-data --platform windows-arm64
          mv "$RUNNER_TEMP/atomic-windows-x64.zip" packages/coding-agent/binaries/
      - name: Verify Windows ARM64 emulated PostgreSQL payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = Join-Path $env:RUNNER_TEMP "atomic-windows-arm64-payload"
          Expand-Archive packages/coding-agent/binaries/atomic-windows-arm64.zip $payload -Force
          $runtime = Join-Path $payload "node_modules/@bastani/atomic-natives/postgres-runtime"
          foreach ($path in @("bin/initdb.exe", "bin/pg_ctl.exe", "bin/postgres.exe", "POSTGRESQL-LICENSE", "EMBEDDED-POSTGRES-UPSTREAM-LICENSE.md", "runtime-provenance.json")) {
            if (-not (Test-Path (Join-Path $runtime $path))) { throw "Missing emulated PostgreSQL payload path: $path" }
          }
          $env:POSTGRES_EXE = Join-Path $runtime "bin/postgres.exe"
          bun -e 'import { readPortableExecutableMachine } from "./scripts/probe-windows-bytecode.ts"; const machine = readPortableExecutableMachine(process.env.POSTGRES_EXE); if (machine !== 0x8664) throw new Error(`PostgreSQL PE machine 0x${machine.toString(16)} is not x64`); console.log("Windows ARM64 archive carries x64 PostgreSQL for emulation");'
      - name: Upload Windows release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomic-windows-archives
          path: packages/coding-agent/binaries/atomic-windows-*.zip
          if-no-files-found: error
          retention-days: 14

  # Build and run each musl archive on the matching stock Alpine architecture.
  # The native binding is downloaded rather than rebuilt, so these legs prove
  # the complete release payload without a second Zig cross-compile.
  alpine-binary-smoke:
    name: Smoke Alpine musl binary (${{ matrix.arch }})
    needs: [integrity, native-artifacts]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: nscloud-ubuntu-24.04-amd64-4x16, arch: x64, slug: linux-x64-musl, platform: linux-x64-musl, docker_platform: linux/amd64 }
          - { runner: nscloud-ubuntu-24.04-arm64-4x16, arch: arm64, slug: linux-arm64-musl, platform: linux-arm64-musl, docker_platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify installed musl archive tooling
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          command -v patchelf
          patchelf --version
      - name: Download musl native binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atomic-natives-${{ matrix.slug }}
          path: packages/natives/native
      - name: Build Linux musl archive
        run: ./scripts/build-binaries.sh --skip-deps --platform "${{ matrix.platform }}"
      - name: Smoke real musl release archive on stock Alpine
        run: ./scripts/test-musl-release-archive.sh "packages/coding-agent/binaries/atomic-${{ matrix.platform }}.tar.gz" "${{ matrix.platform }}"
      - name: Load the musl native binding under musl libc
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/atomic-alpine-native-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          tar -xzf "packages/coding-agent/binaries/atomic-${{ matrix.platform }}.tar.gz" -C "$smoke"
          # `atomic` catches a failed binding load and degrades to the JS search
          # paths, so starting is not proof the addon dlopen'd. Require it here.
          docker run --rm --platform "${{ matrix.docker_platform }}" -v "$smoke:/smoke:ro" node:22-alpine node -e '
            const binding = require("/smoke/atomic/node_modules/@bastani/atomic-natives");
            for (const name of ["glob", "grep"]) {
              if (typeof binding[name] !== "function") throw new Error(`musl binding is missing ${name}()`);
            }
            console.log("musl native binding loaded:", Object.keys(binding).length, "exports");'

  build:
    name: Build release payload
    needs: [integrity, native-artifacts, linux-binary-smoke, windows-binary-smoke, alpine-binary-smoke]
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies and verify shrinkwrap
        run: |
          npm ci --ignore-scripts
          npm run check:shrinkwrap
      - name: Download native bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atomic-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Prepare native packages
        run: |
          bun run --cwd packages/natives create-npm-dirs
          bun run --cwd packages/natives artifacts
          bun run --cwd packages/natives prepublish:native -- --skip-optional-publish
      - name: Stage embedded PostgreSQL in target native packages
        run: |
          node scripts/stage-postgres-runtime.mjs linux-x64 packages/natives/npm/linux-x64-gnu
          node scripts/stage-postgres-runtime.mjs linux-arm64 packages/natives/npm/linux-arm64-gnu
          node scripts/stage-postgres-runtime.mjs darwin-x64 packages/natives/npm/darwin-x64
          node scripts/stage-postgres-runtime.mjs darwin-arm64 packages/natives/npm/darwin-arm64
          node scripts/stage-postgres-runtime.mjs windows-x64 packages/natives/npm/win32-x64-msvc
          node scripts/stage-postgres-runtime.mjs linux-x64-musl packages/natives/npm/linux-x64-musl
          node scripts/stage-postgres-runtime.mjs linux-arm64-musl packages/natives/npm/linux-arm64-musl
          node scripts/stage-postgres-runtime.mjs windows-arm64 packages/natives/npm/win32-arm64-msvc
      - name: Verify installed musl archive tooling
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          command -v patchelf
          patchelf --version
      - name: Hydrate release model data
        run: npm run hydrate:model-data
      - name: Build release archives
        run: ./scripts/build-binaries.sh --skip-install --offline-model-data --skip-windows
      # The Windows archives are compiled on the Windows runner because Bun
      # 1.4.0 cross-compiled Windows bytecode launchers crash at startup.
      - name: Stage Windows-built release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atomic-windows-archives
          path: packages/coding-agent/binaries
      - name: Validate package metadata and prepare payload
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
        run: |
          set -euo pipefail
          bun run scripts/assert-builtin-set.ts packages/coding-agent/dist/builtin
          bun run - <<'JAVASCRIPT'
            import { existsSync, readdirSync } from "node:fs";
            const atomic = await Bun.file("packages/coding-agent/package.json").json();
            const natives = await Bun.file("packages/natives/package.json").json();
            const failures = [];
            if (atomic.name !== "@bastani/atomic" || atomic.version !== process.env.VERSION || atomic.private) failures.push("invalid @bastani/atomic identity");
            if (atomic.bin?.atomic !== "dist/cli.js") failures.push("invalid atomic bin metadata");
            if (natives.name !== "@bastani/atomic-natives" || natives.version !== process.env.VERSION || natives.private) failures.push("invalid native root identity");
            for (const entry of readdirSync("packages", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const path = `packages/${entry.name}/package.json`;
              if (!existsSync(path)) continue;
              const pkg = await Bun.file(path).json();
              if (pkg.version !== process.env.VERSION) failures.push(`${path} has version ${pkg.version}`);
              if (!["@bastani/atomic", "@bastani/atomic-natives", "@bastani/pi-ai"].includes(pkg.name) && pkg.private !== true) failures.push(`${pkg.name} must remain private`);
            }
            const piAi = await Bun.file("packages/ai/package.json").json();
            if (piAi.name !== "@bastani/pi-ai" || piAi.version !== process.env.VERSION || piAi.private) failures.push("invalid @bastani/pi-ai identity");
            for (const pkg of [atomic, natives, piAi]) for (const deps of [pkg.dependencies, pkg.optionalDependencies, pkg.peerDependencies]) for (const [name, range] of Object.entries(deps ?? {})) if (String(range).startsWith("workspace:")) failures.push(`workspace range: ${name}`);
            for (const path of [atomic.main, atomic.types, atomic.bin?.atomic, "dist/builtin", "dist/builtin/workflows/package.json", "dist/builtin/subagents/package.json", "dist/builtin/mcp/package.json", "dist/builtin/web-access/package.json", "dist/builtin/intercom/package.json"]) if (!path || !existsSync(`packages/coding-agent/${path}`)) failures.push(`missing ${path}`);
            for (const native of ["darwin-arm64","darwin-x64","linux-arm64-gnu","linux-arm64-musl","linux-x64-gnu","linux-x64-musl","win32-arm64-msvc","win32-x64-msvc"]) if (!existsSync(`packages/natives/native/atomic_natives.${native}.node`)) failures.push(`missing native ${native}`);
            if (failures.length) throw new Error(failures.join("\n"));
          JAVASCRIPT
          rm -rf release-assets npm-packages
          mkdir release-assets npm-packages
          cp packages/coding-agent/binaries/atomic-*.tar.gz packages/coding-agent/binaries/atomic-*.zip release-assets/
          bun run scripts/build-release-notes.ts "$VERSION" --out release-assets/RELEASE_NOTES.md
          (cd release-assets && sha256sum atomic-*.tar.gz atomic-*.zip > SHA256SUMS)
          bun run --cwd packages/ai build
          for dir in packages/natives/npm/* packages/natives packages/ai packages/coding-agent; do npm pack "./$dir" --pack-destination npm-packages; done
          test "$(find npm-packages -name '*.tgz' -type f | wc -l | tr -d ' ')" = 11
          for file in npm-packages/*.tgz; do
            name=$(tar -xOf "$file" package/package.json | jq -r .name)
            # List once into a file: `tar -tzf | grep -q` closes the pipe on the first
            # match, tar dies with "stdout: write error", and pipefail fails the step.
            listing=$(mktemp)
            tar -tzf "$file" > "$listing"
            case "$name" in
              @bastani/atomic-natives-*)
                grep -q '^package/postgres-runtime/bin/' "$listing"
                grep -q '^package/postgres-runtime/POSTGRESQL-LICENSE$' "$listing"
                grep -q '^package/postgres-runtime/runtime-provenance.json$' "$listing"
                leaf=${name#@bastani/atomic-natives-}
                target=${leaf%-gnu}
                case "$leaf" in win32-*) target="windows-${leaf#win32-}"; target=${target%-msvc} ;; esac
                unpacked=$(mktemp -d)
                tar -xzf "$file" -C "$unpacked"
                node scripts/stage-postgres-runtime.mjs "$target" "$unpacked/package" --validate
                rm -rf "$unpacked"
                ;;
            esac
            rm -f "$listing"
          done
          bun -e '
            const expected = new Set(["@bastani/atomic-natives-darwin-arm64","@bastani/atomic-natives-darwin-x64","@bastani/atomic-natives-linux-arm64-gnu","@bastani/atomic-natives-linux-arm64-musl","@bastani/atomic-natives-linux-x64-gnu","@bastani/atomic-natives-linux-x64-musl","@bastani/atomic-natives-win32-arm64-msvc","@bastani/atomic-natives-win32-x64-msvc"]);
            const root = await Bun.file("packages/natives/package.json").json();
            const actual = Object.keys(root.optionalDependencies ?? {});
            if (actual.length !== 8 || actual.some((name) => !expected.has(name) || root.optionalDependencies[name] !== process.env.VERSION)) throw new Error("native optionalDependencies must be the eight exact-version platform packages");'
      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
          path: |
            release-assets
            npm-packages
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    name: Stage draft GitHub Release
    needs: [integrity, build]
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
      - name: Validate and stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != false ]] || { echo "GitHub Release $RELEASE_TAG is already published. Refusing to mutate a public release." >&2; exit 1; }
          [[ "$existing" != true ]] || gh release delete "$RELEASE_TAG" --yes
          assets=(atomic-darwin-arm64.tar.gz atomic-darwin-x64.tar.gz atomic-linux-x64.tar.gz atomic-linux-arm64.tar.gz atomic-linux-x64-musl.tar.gz atomic-linux-arm64-musl.tar.gz atomic-windows-x64.zip atomic-windows-arm64.zip SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md "${assets[@]}"
          expected=$(printf '%s\n' "${assets[@]}" | sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          [[ "$actual" == "$expected" ]] || { echo "Draft release asset set mismatch" >&2; exit 1; }

  publish-npm:
    name: Publish npm packages
    needs: [integrity, stage-github-release]
    # Must stay GitHub-hosted: npm trusted publishing rejects self-hosted runners,
    # and Namespace runners register with GitHub as self-hosted, so the registry
    # refuses their provenance (runner_environment=self-hosted). See docs/ci.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
          path: payload
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts
      - name: Publish native packages then coding agent
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
          NPM_TAG: ${{ needs.integrity.outputs.npm-tag }}
        run: |
          set -euo pipefail
          declare -A tarballs=()
          for file in payload/npm-packages/*.tgz; do
            name=$(tar -xOf "$file" package/package.json | jq -er .name)
            version=$(tar -xOf "$file" package/package.json | jq -er .version)
            [[ "$version" == "$VERSION" ]] || { echo "$name has version $version, expected $VERSION" >&2; exit 1; }
            tarballs[$name]="$file"
          done
          packages=(@bastani/atomic-natives-darwin-arm64 @bastani/atomic-natives-darwin-x64 @bastani/atomic-natives-linux-arm64-gnu @bastani/atomic-natives-linux-arm64-musl @bastani/atomic-natives-linux-x64-gnu @bastani/atomic-natives-linux-x64-musl @bastani/atomic-natives-win32-arm64-msvc @bastani/atomic-natives-win32-x64-msvc @bastani/atomic-natives @bastani/pi-ai @bastani/atomic)
          [[ "${#tarballs[@]}" -eq "${#packages[@]}" ]] || { echo "Expected exactly eleven npm packages" >&2; exit 1; }
          for name in "${packages[@]}"; do
            [[ -n "${tarballs[$name]:-}" ]] || { echo "Missing package $name" >&2; exit 1; }
            if npm view "$name@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$VERSION already exists; skipping."
            else
              npm publish "${tarballs[$name]}" --provenance --access public --tag "$NPM_TAG" --registry https://registry.npmjs.org
            fi
          done

  publish-github-release:
    name: Publish GitHub Release
    needs: [stage-github-release, publish-npm]
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" == true ]] || { echo "Draft GitHub Release $RELEASE_TAG does not exist." >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=${{ contains(env.RELEASE_TAG, '-') }} --latest=${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}

  register-published-version:
    name: Register published version
    needs: [integrity, publish-github-release]
    # The registration Worker checks the OIDC issuer, audience, repository, tag
    # ref, workflow ref, subject, event and environment claims, never
    # runner_environment, so this job does not need a GitHub-hosted runner.
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      # The step below runs `node -e`; the Namespace image does not promise Node
      # on PATH the way GitHub-hosted images do.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Register published version
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
        run: |
          set -euo pipefail
          set +x
          version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.[1-9][0-9]*)?'
          [[ "$VERSION" =~ ^$version_re$ ]] || { echo "Invalid version" >&2; exit 1; }
          [[ "$VERSION" != "0.0.0" ]] || { echo "Refusing 0.0.0" >&2; exit 1; }
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL-}"
          # Token acquisition host is runner-provided and need not equal the JWT
          # issuer (https://token.actions.githubusercontent.com). Parse it; do not
          # treat any HTTPS URL as trusted.
          node -e '
            let parsed;
            try {
              parsed = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL ?? "");
            } catch {
              process.exit(1);
            }
            if (parsed.protocol !== "https:") process.exit(1);
            if (parsed.username !== "" || parsed.password !== "") process.exit(1);
            if (parsed.port !== "") process.exit(1);
            const host = parsed.hostname.toLowerCase();
            if (
              host !== "actions.githubusercontent.com" &&
              !host.endsWith(".actions.githubusercontent.com")
            ) {
              process.exit(1);
            }
          ' || { echo "OIDC request URL is not a GitHub Actions token endpoint" >&2; exit 1; }
          encoded_audience='https%3A%2F%2Fatomic-version-adoption.bastani-atomic.workers.dev%2Fv1%2Fpublished-versions'
          endpoint="https://atomic-version-adoption.bastani-atomic.workers.dev/v1/published-versions?version=${VERSION}"
          attempt=1
          max_attempts=3
          while true; do
            token=""
            oidc_body=$(mktemp)
            oidc_code=$(curl --silent --show-error --output "$oidc_body" --write-out '%{http_code}' \
              --max-time 15 --max-redirs 0 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H "Accept: application/json; api-version=2.0" \
              "${request_url}&audience=${encoded_audience}" || true)
            if [[ -z "$oidc_code" ]]; then
              oidc_code=000
            fi
            if [[ "$oidc_code" == "200" ]]; then
              token=$(jq -er 'if (.value | type == "string" and length > 0) then .value else empty end' "$oidc_body" || true)
            fi
            rm -f "$oidc_body"
            unset oidc_body
            if [[ -z "$token" ]]; then
              if [[ "$attempt" -ge "$max_attempts" ]]; then
                echo "OIDC token acquisition failed after ${attempt} attempts" >&2
                exit 1
              fi
              case "$oidc_code" in
                429|500|502|503|504|000) ;;
                *) echo "OIDC token acquisition failed with HTTP ${oidc_code}" >&2; exit 1 ;;
              esac
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
              continue
            fi
            echo "::add-mask::${token}"
            http_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --max-time 15 --max-redirs 0 \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Length: 0" \
              "$endpoint" || true)
            unset token
            if [[ -z "$http_code" ]]; then
              http_code=000
            fi
            if [[ "$http_code" == "204" ]]; then
              exit 0
            fi
            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "Registration failed after ${attempt} attempts" >&2
              exit 1
            fi
            case "$http_code" in
              429|500|502|503|504|000) ;;
              *) echo "Registration failed with HTTP ${http_code}" >&2; exit 1 ;;
            esac
            attempt=$((attempt + 1))
            sleep $((attempt * 2))
          done

  cleanup-draft-github-release:
    name: Clean up failed draft GitHub Release
    needs: [build, stage-github-release, publish-npm, publish-github-release]
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-npm.result != 'success' || needs.publish-github-release.result != 'success') }}
    runs-on: nscloud-ubuntu-24.04-amd64-4x16
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != true ]] || gh release delete "$RELEASE_TAG" --yes

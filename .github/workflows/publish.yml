name: Publish
run-name: Publish ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., 0.9.10 or 0.9.10-alpha.1)"
        required: true
        type: string
      source_ref:
        description: "Source ref to build/publish (defaults to tag; use only for release recovery)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
  PACKAGE_DIR: packages/coding-agent
  GLIBC_FLOOR: "2.17"
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  integrity:
    name: Verify release tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
      npm-tag: ${{ steps.verify.outputs.npm-tag }}
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify tag commit identity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          version_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.[1-9][0-9]*)?'
          [[ "$RELEASE_TAG" =~ ^$version_re$ ]] || { echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          sha=$(git rev-parse HEAD^{commit})
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          [[ "$sha" == "$tag_sha" ]] || { echo "Source ref does not resolve to tag commit $tag_sha" >&2; exit 1; }
          version=$(bun -e 'console.log((await Bun.file("packages/coding-agent/package.json").json()).version)')
          [[ "$version" == "$RELEASE_TAG" ]] || { echo "Package version $version does not match tag $RELEASE_TAG" >&2; exit 1; }
          subject=$(git show -s --format=%s HEAD)
          [[ "$subject" == "Release $RELEASE_TAG" ]] || { echo "Commit subject must be Release $RELEASE_TAG; found: $subject" >&2; exit 1; }
          npm_tag=latest
          [[ "$version" == *-alpha.* ]] && npm_tag=next
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$npm_tag" >> "$GITHUB_OUTPUT"

  native-artifacts:
    name: Native ${{ matrix.slug }}
    needs: integrity
    runs-on: ${{ matrix.runner }}
    # Job caps are hang detectors, sized per leg from the last eight releases.
    # The per-step `timeout-minutes` below are the stall detectors. See docs/ci.md.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      # cargo-xwin fetches both CRTs by default; each Windows leg links one.
      XWIN_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        # timeout_minutes caps the job; build_timeout_minutes caps the compile step.
        # `slug` is the napi platform id: it names the .node file, the npm leaf, and
        # this leg's artifact, so two legs that share platform+arch (glibc and musl
        # Linux) can never collide on an artifact name.
        include:
          - { runner: blacksmith-4vcpu-ubuntu-2404, platform: linux, arch: x64, slug: linux-x64-gnu, target: x86_64-unknown-linux-gnu, timeout_minutes: 7, build_timeout_minutes: 5 }
          - { runner: blacksmith-4vcpu-ubuntu-2404-arm, platform: linux, arch: arm64, slug: linux-arm64-gnu, target: aarch64-unknown-linux-gnu, timeout_minutes: 8, build_timeout_minutes: 5 }
          # musl legs reuse the same zig toolchain; @napi-rs/cli adds
          # `-C target-feature=-crt-static` for a musl ABI, which is what keeps the
          # produced .node a dlopen-able shared object instead of a static-CRT blob.
          - { runner: blacksmith-4vcpu-ubuntu-2404, platform: linux, arch: x64, slug: linux-x64-musl, target: x86_64-unknown-linux-musl, timeout_minutes: 7, build_timeout_minutes: 5 }
          - { runner: blacksmith-4vcpu-ubuntu-2404-arm, platform: linux, arch: arm64, slug: linux-arm64-musl, target: aarch64-unknown-linux-musl, timeout_minutes: 8, build_timeout_minutes: 5 }
          # Blacksmith macOS is Apple Silicon only, so darwin x64 stays GitHub-hosted.
          - { runner: macos-26-intel, platform: darwin, arch: x64, slug: darwin-x64, target: x86_64-apple-darwin, timeout_minutes: 9, build_timeout_minutes: 8 }
          - { runner: blacksmith-6vcpu-macos-26, platform: darwin, arch: arm64, slug: darwin-arm64, target: aarch64-apple-darwin, timeout_minutes: 5, build_timeout_minutes: 5 }
          - { runner: blacksmith-4vcpu-ubuntu-2404, platform: win32, arch: x64, slug: win32-x64-msvc, target: x86_64-pc-windows-msvc, timeout_minutes: 10, build_timeout_minutes: 5 }
          - { runner: blacksmith-4vcpu-ubuntu-2404, platform: win32, arch: arm64, slug: win32-arm64-msvc, target: aarch64-pc-windows-msvc, timeout_minutes: 10, build_timeout_minutes: 5 }
    steps:
      # Sticky disks are Blacksmith-Linux-only; elsewhere this action stalls ~78s
      # before falling back to a normal clone.
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        if: runner.os == 'Linux'
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Linux'
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # rustup needs the bare target; only the glibc Linux legs separately receive
      # the glibc-suffixed target consumed by cargo-zigbuild.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - name: Prefer pinned rustup toolchain on macOS
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Resolve explicit native build target
        id: target
        shell: bash
        env:
          BARE_TARGET: ${{ matrix.target }}
        run: |
          # Only a glibc triple gets the floor suffix. build-native.ts routes
          # `<triple>.<major>.<minor>` straight to cargo-zigbuild's glibc pinning;
          # a musl triple must stay bare so it falls through to napi's
          # --cross-compile path, which is what applies -crt-static.
          build_target="$BARE_TARGET"
          [[ "$BARE_TARGET" != *-unknown-linux-gnu ]] || build_target="${BARE_TARGET}.${GLIBC_FLOOR}"
          echo "build-target=$build_target" >> "$GITHUB_OUTPUT"
      - name: Set baseline x64 CPU flags
        if: matrix.arch == 'x64'
        shell: bash
        run: echo 'RUSTFLAGS=-C target-cpu=x86-64-v2' >> "$GITHUB_ENV"
      # Community Zig mirrors have stalled two releases (795.9s and 437.6s).
      # setup-zig applies no per-mirror deadline, so bound it and retry once on a
      # re-shuffled mirror list: a stall now costs at most 4 minutes and fails loudly.
      - name: Setup zig for portable Linux builds
        id: zig
        if: matrix.platform == 'linux'
        continue-on-error: true
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          # Blacksmith is not github-hosted, so the tool cache dies with the VM.
          use-tool-cache: false
          # Global .zig-cache, not the tarball cache. Its save key embeds the run id,
          # so it can never be reused, and disabling it keeps the retry's post step inert.
          use-cache: false
      - name: Retry zig acquisition on a re-shuffled mirror list
        if: matrix.platform == 'linux' && steps.zig.outcome == 'failure'
        timeout-minutes: 2
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          use-tool-cache: false
          use-cache: false
      # Unversioned taiki-e tools resolve to @latest, floating the build toolchain
      # of a provenance-signed artifact with no diff.
      - name: Install cargo-zigbuild for portable Linux builds
        if: matrix.platform == 'linux'
        timeout-minutes: 3
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-zigbuild@0.23.0
      - name: Install Windows cross-compile tooling
        if: matrix.platform == 'win32'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Install cargo-xwin
        if: matrix.platform == 'win32'
        timeout-minutes: 3
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-xwin@0.23.0
      # Pinned so the populate step, the build step, and actions/cache agree
      # regardless of XDG_CACHE_HOME.
      - name: Resolve MSVC CRT cache directory
        if: matrix.platform == 'win32'
        shell: bash
        run: echo "XWIN_CACHE_DIR=$HOME/.cache/cargo-xwin" >> "$GITHUB_ENV"
      # Largest standing cost in this job: 3m46s-6m19s per Windows leg, every
      # release, for a ~25s compile. A hit pins the leg to the SDK first stored
      # under this key; bump the `xwin-v1` epoch to force a refresh.
      - name: Restore MSVC CRT and Windows SDK
        if: matrix.platform == 'win32'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-v1-${{ matrix.arch }}-17
      # 1.27x the worst measured full download (6m19s), sized on measurement
      # rather than on the saving XWIN_ARCH is expected to deliver.
      - name: Populate MSVC CRT cache on miss
        if: matrix.platform == 'win32'
        timeout-minutes: 8
        env:
          XWIN_ACCEPT_LICENSE: "1"
        run: cargo-xwin xwin cache xwin
      # The CRT fetch is hoisted above, so this is a compile: each budget is that
      # leg's measured p100 times at least 1.4.
      - name: Build native binding
        timeout-minutes: ${{ matrix.build_timeout_minutes }}
        env:
          CROSS_TARGET: ${{ matrix.platform != 'darwin' && steps.target.outputs.build-target || '' }}
          NATIVE_TARGET: ${{ matrix.platform == 'darwin' && matrix.target || '' }}
          XWIN_ACCEPT_LICENSE: "1"
        run: bun run --cwd packages/natives build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomic-natives-${{ matrix.slug }}
          path: packages/natives/native/*.node
          if-no-files-found: error
          retention-days: 14

  linux-binary-smoke:
    name: Smoke Linux binary
    needs: integrity
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
      - name: Build Linux x64 archive
        run: ./scripts/build-binaries.sh --skip-deps --platform linux-x64
      - name: Smoke Linux release archive
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/atomic-linux-smoke"
          mkdir -p "$smoke"
          tar -xzf packages/coding-agent/binaries/atomic-linux-x64.tar.gz -C "$smoke"
          "$smoke/atomic/atomic" --version
          bun run scripts/assert-builtin-set.ts "$smoke/atomic/builtin"
          for path in app.js image-resize-worker.js builtin/workflows/package.json builtin/subagents/package.json builtin/mcp/package.json builtin/web-access/package.json builtin/intercom/package.json node_modules/@bastani/atomic-natives/package.json node_modules/@bastani/atomic-natives/native/atomic_natives.linux-x64-gnu.node node_modules/@modelcontextprotocol/ext-apps/package.json node_modules/@mozilla/readability/package.json node_modules/@earendil-works/pi-ai/dist/models.generated.js node_modules/@earendil-works/pi-ai/dist/image-models.generated.js node_modules/@earendil-works/pi-ai/dist/providers/data/.manifest.json node_modules/@earendil-works/pi-ai/dist/providers/data/amazon-bedrock.json node_modules/@earendil-works/pi-ai/dist/providers/data/anthropic.json node_modules/@earendil-works/pi-ai/dist/providers/data/kimi-coding.json node_modules/@earendil-works/pi-ai/dist/providers/data/openrouter.json node_modules/@earendil-works/pi-ai/dist/auth/oauth/kimi-coding.js node_modules/@earendil-works/pi-ai/dist/auth/oauth/openrouter.js node_modules/@earendil-works/pi-ai/dist/bun-oauth.js; do
            test -f "$smoke/atomic/$path" || { echo "Missing release archive path: $path" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/atomic-linux-cwd"
          set +e
          output=$(cd "$RUNNER_TEMP/atomic-linux-cwd" && printf '' | "$smoke/atomic/atomic" --no-session 2>&1)
          status=$?
          set -e
          echo "$output"
          ! grep -q 'Failed to load extension' <<<"$output"
          [[ "$status" -eq 0 ]] || grep -Eq 'No models available|No model selected|No API key found' <<<"$output"

  windows-binary-smoke:
    name: Smoke Windows binary
    needs: integrity
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      # Windows has no sticky disk, so ask for the standard clone directly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        timeout-minutes: 4
        with:
          toolchain: 1.97.0
      - name: Build Windows x64 archive
        shell: bash
        run: ./scripts/build-binaries.sh --skip-deps --platform windows-x64
      - name: Smoke Windows release archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smoke = Join-Path $env:RUNNER_TEMP "atomic-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Expand-Archive packages/coding-agent/binaries/atomic-windows-x64.zip $smoke -Force
          $atomic = Join-Path $smoke "atomic.exe"
          & $atomic --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run scripts/assert-builtin-set.ts (Join-Path $smoke "builtin")
          foreach ($path in @("app.js", "image-resize-worker.js", "builtin/workflows/package.json", "builtin/subagents/package.json", "builtin/mcp/package.json", "builtin/web-access/package.json", "builtin/intercom/package.json", "node_modules/@bastani/atomic-natives/package.json", "node_modules/@bastani/atomic-natives/native/atomic_natives.win32-x64-msvc.node", "native/win32/prebuilds/win32-x64/win32-console-mode.node", "node_modules/@modelcontextprotocol/ext-apps/package.json", "node_modules/@mozilla/readability/package.json", "node_modules/@earendil-works/pi-ai/dist/models.generated.js", "node_modules/@earendil-works/pi-ai/dist/image-models.generated.js", "node_modules/@earendil-works/pi-ai/dist/providers/data/.manifest.json", "node_modules/@earendil-works/pi-ai/dist/providers/data/amazon-bedrock.json", "node_modules/@earendil-works/pi-ai/dist/providers/data/anthropic.json", "node_modules/@earendil-works/pi-ai/dist/providers/data/kimi-coding.json", "node_modules/@earendil-works/pi-ai/dist/providers/data/openrouter.json", "node_modules/@earendil-works/pi-ai/dist/auth/oauth/kimi-coding.js", "node_modules/@earendil-works/pi-ai/dist/auth/oauth/openrouter.js", "node_modules/@earendil-works/pi-ai/dist/bun-oauth.js")) {
            if (-not (Test-Path (Join-Path $smoke $path))) { throw "Missing release archive path: $path" }
          }
          $cwd = Join-Path $env:RUNNER_TEMP "atomic-windows-cwd"
          New-Item -ItemType Directory -Force -Path $cwd | Out-Null
          Push-Location $cwd
          $output = "" | & $atomic --no-session 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($output -match "Failed to load extension") { exit 1 }
          if ($status -ne 0 -and $output -notmatch "No models available|No model selected|No API key found") { exit $status }

  # The one leg that proves musl at runtime rather than at link time. Docker is the
  # only way to reach a musl userspace from a Blacksmith Ubuntu runner, and the
  # native binding is downloaded rather than rebuilt so this job costs an archive
  # build instead of a second zig cross-compile.
  alpine-binary-smoke:
    name: Smoke Alpine musl binary
    needs: [integrity, native-artifacts]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 12
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download musl native binding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: atomic-natives-linux-x64-musl
          path: packages/natives/native
      - name: Build Linux x64 musl archive
        run: ./scripts/build-binaries.sh --skip-deps --platform linux-x64-musl
      - name: Smoke musl release archive on Alpine
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/atomic-alpine-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke"
          tar -xzf packages/coding-agent/binaries/atomic-linux-x64-musl.tar.gz -C "$smoke"
          cat > "$smoke/smoke.sh" <<'SMOKE'
          set -eu
          apk add --no-cache libgcc libstdc++
          atomic=/smoke/atomic/atomic
          "$atomic" --version
          mkdir -p /tmp/atomic-alpine-cwd
          cd /tmp/atomic-alpine-cwd
          set +e
          output=$(printf '' | "$atomic" --no-session 2>&1)
          status=$?
          set -e
          echo "$output"
          if echo "$output" | grep -q 'Failed to load extension'; then exit 1; fi
          if [ "$status" -ne 0 ] && ! echo "$output" | grep -Eq 'No models available|No model selected|No API key found'; then
            exit "$status"
          fi
          SMOKE
          docker run --rm -v "$smoke:/smoke" alpine:3.22 /bin/sh /smoke/smoke.sh
      - name: Load the musl native binding under musl libc
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/atomic-alpine-smoke"
          # `atomic` catches a failed binding load and degrades to the JS search
          # paths, so starting is not proof the addon dlopen'd. Require it here.
          docker run --rm -v "$smoke:/smoke" node:22-alpine node -e '
            const binding = require("/smoke/atomic/node_modules/@bastani/atomic-natives");
            for (const name of ["glob", "grep"]) {
              if (typeof binding[name] !== "function") throw new Error(`musl binding is missing ${name}()`);
            }
            console.log("musl native binding loaded:", Object.keys(binding).length, "exports");'

  build:
    name: Build release payload
    needs: [integrity, native-artifacts, linux-binary-smoke, windows-binary-smoke, alpine-binary-smoke]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies and verify shrinkwrap
        run: |
          npm ci --ignore-scripts
          npm run check:shrinkwrap
      - name: Download native bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: atomic-natives-*
          path: packages/natives/native
          merge-multiple: true
      - name: Prepare native packages
        run: |
          bun run --cwd packages/natives create-npm-dirs
          bun run --cwd packages/natives artifacts
          bun run --cwd packages/natives prepublish:native -- --skip-optional-publish
      - name: Build release archives
        run: ./scripts/build-binaries.sh --skip-install
      - name: Validate package metadata and prepare payload
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
        run: |
          set -euo pipefail
          bun run scripts/assert-builtin-set.ts packages/coding-agent/dist/builtin
          bun -e '
            import { existsSync, readdirSync } from "node:fs";
            const atomic = await Bun.file("packages/coding-agent/package.json").json();
            const natives = await Bun.file("packages/natives/package.json").json();
            const failures = [];
            if (atomic.name !== "@bastani/atomic" || atomic.version !== process.env.VERSION || atomic.private) failures.push("invalid @bastani/atomic identity");
            if (atomic.bin?.atomic !== "dist/cli.js") failures.push("invalid atomic bin metadata");
            if (natives.name !== "@bastani/atomic-natives" || natives.version !== process.env.VERSION || natives.private) failures.push("invalid native root identity");
            for (const entry of readdirSync("packages", { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const path = `packages/${entry.name}/package.json`;
              if (!existsSync(path)) continue;
              const pkg = await Bun.file(path).json();
              if (pkg.version !== process.env.VERSION) failures.push(`${path} has version ${pkg.version}`);
              if (!["@bastani/atomic", "@bastani/atomic-natives"].includes(pkg.name) && pkg.private !== true) failures.push(`${pkg.name} must remain private`);
            }
            for (const pkg of [atomic, natives]) for (const deps of [pkg.dependencies, pkg.optionalDependencies, pkg.peerDependencies]) for (const [name, range] of Object.entries(deps ?? {})) if (String(range).startsWith("workspace:")) failures.push(`workspace range: ${name}`);
            for (const path of [atomic.main, atomic.types, atomic.bin?.atomic, "dist/builtin", "dist/builtin/workflows/package.json", "dist/builtin/subagents/package.json", "dist/builtin/mcp/package.json", "dist/builtin/web-access/package.json", "dist/builtin/intercom/package.json"]) if (!path || !existsSync(`packages/coding-agent/${path}`)) failures.push(`missing ${path}`);
            for (const native of ["darwin-arm64","darwin-x64","linux-arm64-gnu","linux-arm64-musl","linux-x64-gnu","linux-x64-musl","win32-arm64-msvc","win32-x64-msvc"]) if (!existsSync(`packages/natives/native/atomic_natives.${native}.node`)) failures.push(`missing native ${native}`);
            if (failures.length) throw new Error(failures.join("\n"));'
          rm -rf release-assets npm-packages
          mkdir release-assets npm-packages
          cp packages/coding-agent/binaries/atomic-*.tar.gz packages/coding-agent/binaries/atomic-*.zip release-assets/
          awk -v ver="$VERSION" 'BEGIN { found=0 } /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") { found=1; next } } found { print }' packages/coding-agent/CHANGELOG.md > release-assets/RELEASE_NOTES.md
          test -s release-assets/RELEASE_NOTES.md || echo "Release $VERSION" > release-assets/RELEASE_NOTES.md
          (cd release-assets && sha256sum atomic-*.tar.gz atomic-*.zip > SHA256SUMS)
          for dir in packages/natives/npm/* packages/natives packages/coding-agent; do npm pack "./$dir" --pack-destination npm-packages; done
          test "$(find npm-packages -name '*.tgz' -type f | wc -l | tr -d ' ')" = 10
          bun -e '
            const expected = new Set(["@bastani/atomic-natives-darwin-arm64","@bastani/atomic-natives-darwin-x64","@bastani/atomic-natives-linux-arm64-gnu","@bastani/atomic-natives-linux-arm64-musl","@bastani/atomic-natives-linux-x64-gnu","@bastani/atomic-natives-linux-x64-musl","@bastani/atomic-natives-win32-arm64-msvc","@bastani/atomic-natives-win32-x64-msvc"]);
            const root = await Bun.file("packages/natives/package.json").json();
            const actual = Object.keys(root.optionalDependencies ?? {});
            if (actual.length !== 8 || actual.some((name) => !expected.has(name) || root.optionalDependencies[name] !== process.env.VERSION)) throw new Error("native optionalDependencies must be the eight exact-version platform packages");'
      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
          path: |
            release-assets
            npm-packages
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    name: Stage draft GitHub Release
    needs: [integrity, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
      - name: Validate and stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != false ]] || { echo "GitHub Release $RELEASE_TAG is already published. Refusing to mutate a public release." >&2; exit 1; }
          [[ "$existing" != true ]] || gh release delete "$RELEASE_TAG" --yes
          assets=(atomic-darwin-arm64.tar.gz atomic-darwin-x64.tar.gz atomic-linux-x64.tar.gz atomic-linux-arm64.tar.gz atomic-linux-x64-musl.tar.gz atomic-linux-arm64-musl.tar.gz atomic-windows-x64.zip atomic-windows-arm64.zip SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md "${assets[@]}"
          expected=$(printf '%s\n' "${assets[@]}" | sort)
          actual=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
          [[ "$actual" == "$expected" ]] || { echo "Draft release asset set mismatch" >&2; exit 1; }

  publish-npm:
    name: Publish npm packages
    needs: [integrity, stage-github-release]
    # Must stay GitHub-hosted: npm trusted publishing rejects self-hosted runners,
    # and Blacksmith registers through GitHub's org-level runner registration API.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-payload-${{ env.RELEASE_TAG }}
          path: payload
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0 --ignore-scripts
      - name: Publish native packages then coding agent
        env:
          VERSION: ${{ needs.integrity.outputs.version }}
          NPM_TAG: ${{ needs.integrity.outputs.npm-tag }}
        run: |
          set -euo pipefail
          declare -A tarballs=()
          for file in payload/npm-packages/*.tgz; do
            name=$(tar -xOf "$file" package/package.json | jq -er .name)
            version=$(tar -xOf "$file" package/package.json | jq -er .version)
            [[ "$version" == "$VERSION" ]] || { echo "$name has version $version, expected $VERSION" >&2; exit 1; }
            tarballs[$name]="$file"
          done
          packages=(@bastani/atomic-natives-darwin-arm64 @bastani/atomic-natives-darwin-x64 @bastani/atomic-natives-linux-arm64-gnu @bastani/atomic-natives-linux-arm64-musl @bastani/atomic-natives-linux-x64-gnu @bastani/atomic-natives-linux-x64-musl @bastani/atomic-natives-win32-arm64-msvc @bastani/atomic-natives-win32-x64-msvc @bastani/atomic-natives @bastani/atomic)
          [[ "${#tarballs[@]}" -eq "${#packages[@]}" ]] || { echo "Expected exactly ten npm packages" >&2; exit 1; }
          for name in "${packages[@]}"; do
            [[ -n "${tarballs[$name]:-}" ]] || { echo "Missing package $name" >&2; exit 1; }
            if npm view "$name@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "$name@$VERSION already exists; skipping."
            else
              npm publish "${tarballs[$name]}" --provenance --access public --tag "$NPM_TAG" --registry https://registry.npmjs.org
            fi
          done

  publish-github-release:
    name: Publish GitHub Release
    needs: [stage-github-release, publish-npm]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" == true ]] || { echo "Draft GitHub Release $RELEASE_TAG does not exist." >&2; exit 1; }
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=${{ contains(env.RELEASE_TAG, '-') }} --latest=${{ contains(env.RELEASE_TAG, '-') && 'false' || 'true' }}

  cleanup-draft-github-release:
    name: Clean up failed draft GitHub Release
    needs: [build, stage-github-release, publish-npm, publish-github-release]
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-npm.result != 'success' || needs.publish-github-release.result != 'success') }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          [[ "$existing" != true ]] || gh release delete "$RELEASE_TAG" --yes

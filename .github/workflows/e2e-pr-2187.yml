name: atomic-pr-2187-windows-e2e
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  windows-e2e:
    runs-on: windows-latest
    env:
      CANDIDATE_SHA: 927aceaa4fdeab9a7a51495837e23ac6baf58cd6
      RELEASE_TAG: 0.9.14
    steps:
      - name: Checkout the temporary candidate child commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      - name: Assert tested source parent is candidate SHA
        shell: pwsh
        run: |
          $tested = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse 'HEAD^').Trim()
          if ($parent -cne $env:CANDIDATE_SHA) {
            throw "Tested source parent $parent does not equal candidate $env:CANDIDATE_SHA"
          }
          "tested=$tested parent=$parent candidate=$env:CANDIDATE_SHA" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'atomic-pr2187-parent.txt') -Encoding utf8

      - name: Verify the stable release assets
        shell: pwsh
        run: |
          $headers = @{ Accept = 'application/vnd.github+json' }
          $uri = "https://api.github.com/repos/bastani-inc/atomic/releases/tags/$($env:RELEASE_TAG)"
          $release = Invoke-RestMethod -Uri $uri -Headers $headers
          if ([string]$release.tag_name -cne $env:RELEASE_TAG -or $release.draft -or $release.prerelease) {
            throw "Release $($env:RELEASE_TAG) is not a stable published release"
          }
          $requiredAssets = @('atomic-windows-x64.zip', 'atomic-windows-arm64.zip', 'SHA256SUMS')
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          foreach ($requiredAsset in $requiredAssets) {
            if ($assetNames -notcontains $requiredAsset) {
              throw "Stable release is missing required asset $requiredAsset"
            }
          }

      - name: Install the local candidate PowerShell installer
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'atomic-pr2187'
          $install = Join-Path $root 'install'
          $bin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:ATOMIC_INSTALL_DIR = $install
          $env:ATOMIC_BIN_DIR = $bin
          $installLog = Join-Path $root 'install.log'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'install.ps1') -Ref $env:RELEASE_TAG *> $installLog
          $installerExit = $LASTEXITCODE
          if ($installerExit -ne 0) { throw "Candidate installer failed with exit code $installerExit" }
          $shim = Join-Path $bin 'atomic.cmd'
          $binary = Join-Path (Join-Path $install 'current') 'atomic.exe'
          if (-not (Test-Path -LiteralPath $shim -PathType Leaf)) { throw "Installed atomic.cmd is missing: $shim" }
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Installed atomic.exe is missing: $binary" }
          @($shim, $binary) | Set-Content -LiteralPath (Join-Path $root 'paths.txt') -Encoding utf8

      - name: Verify installed version and prepare proven oauth bearer auth
        shell: pwsh
        env:
          CODEX_BEARER_SEED: ${{ secrets.ATOMIC_PR2187_E2E_CODEX_BEARER }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'atomic-pr2187'
          Write-Output "::add-mask::$env:CODEX_BEARER_SEED"
          if ([string]::IsNullOrWhiteSpace($env:CODEX_BEARER_SEED)) { throw 'Codex bearer secret is empty' }
          $paths = @(Get-Content -LiteralPath (Join-Path $root 'paths.txt'))
          $shim = [string]$paths[0]
          $versionOutput = (& $shim --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -cne $env:RELEASE_TAG) {
            throw "Installed atomic --version returned unexpected output: $versionOutput"
          }
          $versionOutput | Set-Content -LiteralPath (Join-Path $root 'version.txt') -Encoding utf8
          $agent = Join-Path $root 'agent'
          New-Item -ItemType Directory -Force -Path $agent | Out-Null
          $auth = [ordered]@{
            'openai-codex' = [ordered]@{
              type = 'oauth'
              access = $env:CODEX_BEARER_SEED
              refresh = '__atomic_pr2187_refresh_not_used__'
              expires = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() + 3600000
            }
          }
          $authJson = $auth | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $agent 'auth.json'), $authJson, [Text.UTF8Encoding]::new($false))
      - name: Run installed binary through ConPTY and require exact response
        shell: pwsh
        env:
          CODEX_BEARER_SEED: ${{ secrets.ATOMIC_PR2187_E2E_CODEX_BEARER }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'atomic-pr2187'
          Set-Location -LiteralPath $root
          Write-Output "::add-mask::$env:CODEX_BEARER_SEED"
          if ([string]::IsNullOrWhiteSpace($env:CODEX_BEARER_SEED)) { throw 'Codex bearer secret is empty' }
          $paths = @(Get-Content -LiteralPath (Join-Path $root 'paths.txt'))
          $shim = [string]$paths[0]
          $agent = Join-Path $root 'agent'
          $env:ATOMIC_CODING_AGENT_DIR = $agent
          $env:ATOMIC_WINDOWS_SHIM = $shim
          $env:ATOMIC_WINDOWS_VERSION = (Get-Content -LiteralPath (Join-Path $root 'version.txt') -Raw).Trim()
          $env:CANDIDATE_SHA = $env:CANDIDATE_SHA
          $env:ATOMIC_WINDOWS_TRANSCRIPT = Join-Path $root 'transcript.txt'
          $env:ATOMIC_WINDOWS_EVIDENCE = Join-Path $root 'windows-evidence.json'
          python -m pip install --disable-pip-version-check --quiet pywinpty
          $driverBase64 = ''
          [IO.File]::WriteAllBytes((Join-Path $root 'windows-pty-driver.py'), [Convert]::FromBase64String($driverBase64))
          & python (Join-Path $root 'windows-pty-driver.py')
          if ($LASTEXITCODE -ne 0) { throw "ConPTY response check failed with exit code $LASTEXITCODE" }

      - name: Upload sanitized evidence and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atomic-pr2187-windows-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}\atomic-pr2187\windows-evidence.json
            ${{ runner.temp }}\atomic-pr2187\transcript.txt

      - name: Remove temporary install and credential state
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'atomic-pr2187') -Recurse -Force -ErrorAction SilentlyContinue

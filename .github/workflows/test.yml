name: Tests

env:
  PREK_DISABLE_INSTALL: "1"

permissions:
  contents: read

# Only `main` runs on push. A release/** or prerelease/** branch always reaches
# CI through its pull request (AGENTS.md, "Agent publishing requests"), so
# listing those globs here made one SHA run the entire workflow twice: two sets
# of runners competing for the same 4vCPU pool, and two competing check runs per
# required context. GitHub keeps the latest result per context name, so one
# spurious failure in the push run blocked the pull request permanently even
# though the pull_request run for that exact SHA was fully green -- runs
# 31047506585 (push, Linux `suites` cancelled on its cap) and 31047542976
# (pull_request, every job green) on sha 772a373.
#
# There is deliberately no `concurrency:` block. A group that cancels a run
# already in flight can kill a run that has published `test (...)`, leaving a
# cancelled required context on a SHA with no superseding successful run, which
# is the failure being fixed here rather than a fix for it.
on:
  push:
    branches: [main]
  pull_request:

# The work runs as five independent jobs. Root suites duplicate setup so neither
# waits for the other; no shared producer sits on their critical path.
#
#   unit-tests      build package -> one of four unit shards (per OS)
#   integration-tests build package -> one of three integration shards (per OS)
#   agent-suite     build ai + native bindings -> one of three pi-ai and coding-agent shards (per OS)
#   release-archive build package -> build-binaries.sh -> archive smoke
#   static-checks   typecheck, docs, Mintlify, CI contracts (Linux)
#   test            result gate; carries the required check contexts
#
# Nothing is passed between jobs as an artifact: waiting for a producer job
# adds a serial dependency, regardless of how cheaply its output transfers.
# The model data the jobs build pi-ai from reaches them through a cache that `main` refreshes,
# not from a producer job, for the same reason (docs/ci.md, "Model data cached, fetched live in one place").
#
# Every job runs on a `namespace-profile-atomic-ci-*` repository runner profile,
# never an inline `nscloud-*` label: this workflow runs fork pull requests, and
# only a profile can set Namespace's Access Level to Restricted, which disables
# Namespace API access for the runner workload. The profiles hold the machine
# shape; see docs/ci.md ("Runners") before resizing one.
jobs:
  unit-tests:
    name: unit-tests (${{ matrix.binary_platform }}, ${{ matrix.shard }}/4)
    strategy:
      matrix:
        # Four shards per OS, balanced by per-OS file durations measured on CI (test/helpers/duration-sequencer.ts).
        # The result gate needs every shard. See docs/ci.md ("Sharded suites").
        binary_platform: [linux-x64, windows-x64]
        shard: [1, 2, 3, 4]
        include:
          # The three suites run on 8 vCPU: on 4 vCPU they averaged 54-77% CPU, and
          # Windows unit/integration hit their caps at p95. See docs/ci.md ("Sizing").
          - binary_platform: linux-x64
            runner: namespace-profile-atomic-ci-linux-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.unit-tests.linux-amd64
            timeout_minutes: 14
          - binary_platform: windows-x64
            runner: namespace-profile-atomic-ci-windows-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.unit-tests.windows-amd64
            timeout_minutes: 14
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Slowest unsharded job (925 s, 411 s of it setup with a 261 s checkout) with a quarter of its 514 s of tests,
    # plus 50%; see docs/ci.md ("Per-job time limits").
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      # One standard clone on every OS. The Namespace git mirror is not used: see
      # docs/ci.md ("Checkout and cache trust model").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No LFS: the unit suite reads none of the LFS files (it passes with every one replaced by its pointer), and an
          # LFS fetch has taken up to 162 s. The coding-agent suite's LFS fixtures are fetched by agent-suite.
          lfs: false
          # Full history and tags: the changelog test compares released sections against their tags. A depth-1 fetch
          # of all 676 tags measured slower (10.8 s) than this full fetch (5.3 s).
          fetch-depth: 0
      - name: Configure private Windows temp storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-temp.ps1
      # Bun is still a declared engine: it compiles the release binaries and runs
      # scripts/*.ts, including the flaky-suite wrapper invoked below. It no
      # longer installs dependencies or runs any suite.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match publish.yml; `latest` cannot be cached by setup-bun.
          bun-version: 1.4.4
      # Node now installs dependencies and runs every suite, so it is required
      # here rather than only by installed-package-node-extensions.test.ts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The bindings depend only on these sources and the Rust compiler, and
      # rust-toolchain.toml tracks `stable`, so the key also carries the ISO week:
      # a hit skips the toolchain and the build, and every week starts from source.
      # Caches a pull request saves are scoped to it; a pull request reads main's.
      - name: Week for the native bindings cache key
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore native bindings built from these sources
        id: natives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/natives/native/*.node
          key: atomic-natives-${{ matrix.binary_platform }}-${{ steps.week.outputs.week }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/package.json', 'packages/natives/scripts/**') }}
      # packages/subagents now drives its children through the Rust control
      # plane in crates/atomic-natives, so the bundled subagent extension fails
      # to load at import without a binding. That takes the root unit and
      # integration suites down with it, not just the in-process runner tests.
      - id: rust
        if: steps.natives.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Configure Namespace dependency and Rust build cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: ${{ steps.natives.outputs.cache-hit == 'true' && 'npm' || 'npm,rust' }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      # Model data (packages/ai/src/providers/data/) is gitignored, and its only source is the upstream
      # catalogs. static-checks is the one job that fetches them live and strictly on every run, and on `main`
      # it saves what it built. Every other job restores the newest snapshot (any day) built from the same
      # generator inputs and builds offline, so a catalog outage can't fail a test shard. Only without a
      # valid snapshot does the job hydrate itself: a cold cache, or a change to the generator or provider list.
      - name: Restore model data
        id: model-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ai/src/providers/data
          key: atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-none
          restore-keys: |
            atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-
          enableCrossOsArchive: true
      - name: Hydrate model data unless the restored snapshot is valid
        shell: bash
        run: |
          if [ -n "${{ steps.model-data.outputs.cache-matched-key }}" ] && npm run check:model-data --workspace=@bastani/pi-ai >/dev/null 2>&1; then
            echo "Using the restored model data snapshot ${{ steps.model-data.outputs.cache-matched-key }}"
          else
            echo "No valid model data snapshot; hydrating from the upstream catalogs"
            npm run hydrate:model-data
          fi
      - name: Build @bastani/pi-ai
        run: npm run build:offline --workspace=@bastani/pi-ai
      # Measured at 42s Linux / 86s Windows, both inside the existing caps.
      - name: Build native bindings for the root suites
        if: steps.natives.outputs.cache-hit != 'true'
        run: npm run build --workspace=@bastani/atomic-natives
      # Unit artifact tests require dist/ to retain their full coverage.
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build
      - name: Unit tests
        run: >-
          bun run scripts/run-test-suite.ts --label "unit tests (${{ matrix.binary_platform }} ${{ matrix.shard }} of 4)"
          -- npm run test:unit -- --shard=${{ matrix.shard }}/4
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact names must be unique across every job in the run:
          # actions/upload-artifact@v4+ fails the whole run on a duplicate.
          name: test-diagnostics-unit-tests-${{ matrix.binary_platform }}-${{ matrix.shard }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  integration-tests:
    name: integration-tests (${{ matrix.binary_platform }}, ${{ matrix.shard }}/3)
    strategy:
      matrix:
        # Three shards per OS, balanced by per-OS file durations measured on CI (test/helpers/duration-sequencer.ts). The result
        # gate below needs every shard, so the required check still covers the whole suite on both hosts.
        binary_platform: [linux-x64, windows-x64]
        shard: [1, 2, 3]
        include:
          - binary_platform: linux-x64
            runner: namespace-profile-atomic-ci-linux-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.integration-tests.linux-amd64
            timeout_minutes: 12
          - binary_platform: windows-x64
            runner: namespace-profile-atomic-ci-windows-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.integration-tests.windows-amd64
            timeout_minutes: 12
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Slowest four-shard job (340 s) scaled to three shards, plus 50%; see docs/ci.md ("Per-job time limits").
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No LFS: the integration suite reads none of the LFS files (GIFs, session fixtures, a PNG behind a debug
          # hotkey), and their fetch took 162 s in job 122402195248. No history either: its git fixtures init their
          # own repositories, and a full fetch of every branch took 4.5 min in job 122378270170.
          lfs: false
          fetch-depth: 1
      - name: Configure private Windows temp storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-temp.ps1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The bindings depend only on these sources and the Rust compiler, and
      # rust-toolchain.toml tracks `stable`, so the key also carries the ISO week:
      # a hit skips the toolchain and the build, and every week starts from source.
      # Caches a pull request saves are scoped to it; a pull request reads main's.
      - name: Week for the native bindings cache key
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore native bindings built from these sources
        id: natives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/natives/native/*.node
          key: atomic-natives-${{ matrix.binary_platform }}-${{ steps.week.outputs.week }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/package.json', 'packages/natives/scripts/**') }}
      - id: rust
        if: steps.natives.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Configure Namespace dependency and Rust build cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: ${{ steps.natives.outputs.cache-hit == 'true' && 'npm' || 'npm,rust' }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      # Model data (packages/ai/src/providers/data/) is gitignored, and its only source is the upstream
      # catalogs. static-checks is the one job that fetches them live and strictly on every run, and on `main`
      # it saves what it built. Every other job restores the newest snapshot (any day) built from the same
      # generator inputs and builds offline, so a catalog outage can't fail a test shard. Only without a
      # valid snapshot does the job hydrate itself: a cold cache, or a change to the generator or provider list.
      - name: Restore model data
        id: model-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ai/src/providers/data
          key: atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-none
          restore-keys: |
            atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-
          enableCrossOsArchive: true
      - name: Hydrate model data unless the restored snapshot is valid
        shell: bash
        run: |
          if [ -n "${{ steps.model-data.outputs.cache-matched-key }}" ] && npm run check:model-data --workspace=@bastani/pi-ai >/dev/null 2>&1; then
            echo "Using the restored model data snapshot ${{ steps.model-data.outputs.cache-matched-key }}"
          else
            echo "No valid model data snapshot; hydrating from the upstream catalogs"
            npm run hydrate:model-data
          fi
      - name: Build @bastani/pi-ai
        run: npm run build:offline --workspace=@bastani/pi-ai
      - name: Build native bindings for the root suites
        if: steps.natives.outputs.cache-hit != 'true'
        run: npm run build --workspace=@bastani/atomic-natives
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build
      - name: Integration tests
        run: >-
          bun run scripts/run-test-suite.ts --label "integration tests (${{ matrix.binary_platform }} ${{ matrix.shard }} of 3)"
          -- npm run test:integration -- --shard=${{ matrix.shard }}/3
        env:
          # Hard-require the installed-package Node smoke on both supported hosts.
          ATOMIC_REQUIRE_INSTALLED_NODE_SMOKE: "1"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-integration-tests-${{ matrix.binary_platform }}-${{ matrix.shard }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  agent-suite:
    name: agent-suite (${{ matrix.binary_platform }}, ${{ matrix.shard }}/3)
    strategy:
      matrix:
        # Three shards per OS, each running its share of both the pi-ai and the coding-agent suites. The
        # coding-agent share is balanced by measured file duration; pi-ai's small suite uses vitest's own split.
        binary_platform: [linux-x64, windows-x64]
        shard: [1, 2, 3]
        include:
          - binary_platform: linux-x64
            runner: namespace-profile-atomic-ci-linux-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.agent-suite.linux-amd64
            timeout_minutes: 10
          - binary_platform: windows-x64
            runner: namespace-profile-atomic-ci-windows-amd64-8x16;overrides.cache-tag=bastani-inc.atomic.ci.agent-suite.windows-amd64
            timeout_minutes: 10
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Slowest recent job (540 s, about 290 s of it setup with a 207 s checkout) with a third of its suites, plus 50%;
    # see docs/ci.md ("Per-job time limits").
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Package LFS assets include session fixtures and the runtime PNG.
          lfs: true
          fetch-depth: 0
      - name: Configure private Windows temp storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-temp.ps1
      # Bun still compiles binaries and runs scripts/*.ts, including the wrapper.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The bindings depend only on these sources and the Rust compiler, and
      # rust-toolchain.toml tracks `stable`, so the key also carries the ISO week:
      # a hit skips the toolchain and the build, and every week starts from source.
      # Caches a pull request saves are scoped to it; a pull request reads main's.
      - name: Week for the native bindings cache key
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore native bindings built from these sources
        id: natives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/natives/native/*.node
          key: atomic-natives-${{ matrix.binary_platform }}-${{ steps.week.outputs.week }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/package.json', 'packages/natives/scripts/**') }}
      - id: rust
        if: steps.natives.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Configure Namespace dependency and Rust build cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: ${{ steps.natives.outputs.cache-hit == 'true' && 'npm' || 'npm,rust' }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      # Model data (packages/ai/src/providers/data/) is gitignored, and its only source is the upstream
      # catalogs. static-checks is the one job that fetches them live and strictly on every run, and on `main`
      # it saves what it built. Every other job restores the newest snapshot (any day) built from the same
      # generator inputs and builds offline, so a catalog outage can't fail a test shard. Only without a
      # valid snapshot does the job hydrate itself: a cold cache, or a change to the generator or provider list.
      - name: Restore model data
        id: model-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ai/src/providers/data
          key: atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-none
          restore-keys: |
            atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-
          enableCrossOsArchive: true
      - name: Hydrate model data unless the restored snapshot is valid
        shell: bash
        run: |
          if [ -n "${{ steps.model-data.outputs.cache-matched-key }}" ] && npm run check:model-data --workspace=@bastani/pi-ai >/dev/null 2>&1; then
            echo "Using the restored model data snapshot ${{ steps.model-data.outputs.cache-matched-key }}"
          else
            echo "No valid model data snapshot; hydrating from the upstream catalogs"
            npm run hydrate:model-data
          fi
      - name: Build @bastani/pi-ai
        run: npm run build:offline --workspace=@bastani/pi-ai
      - name: pi-ai vitest suite
        run: npm run test --workspace=@bastani/pi-ai -- --shard=${{ matrix.shard }}/3
      # packages/coding-agent/test/native-binding-exports.test.ts is hard-required
      # by ATOMIC_REQUIRE_NATIVE_BINDING_SMOKE below, so the vitest suite must
      # stay behind this build.
      - name: Build native bindings for package tests
        if: steps.natives.outputs.cache-hit != 'true'
        run: npm run build --workspace=@bastani/atomic-natives
      - name: coding-agent vitest suite
        run: >-
          bun run scripts/run-test-suite.ts --label "coding-agent tests (${{ matrix.binary_platform }} ${{ matrix.shard }} of 3)"
          -- npm run test --workspace=@bastani/atomic -- --shard=${{ matrix.shard }}/3
        env:
          ATOMIC_REQUIRE_NATIVE_BINDING_SMOKE: "1"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-agent-suite-${{ matrix.binary_platform }}-${{ matrix.shard }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  release-archive:
    name: release-archive (${{ matrix.binary_platform }})
    strategy:
      matrix:
        include:
          - binary_platform: linux-x64
            runner: namespace-profile-atomic-ci-linux-amd64-4x16;overrides.cache-tag=bastani-inc.atomic.ci.release-archive.linux-amd64
            timeout_minutes: 7
          - binary_platform: windows-x64
            runner: namespace-profile-atomic-ci-windows-amd64-4x16;overrides.cache-tag=bastani-inc.atomic.ci.release-archive.windows-amd64
            timeout_minutes: 7
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    # Linux: censored build + remaining packaging/smoke + 50%; September 11 repair in docs/ci.md.
    # Windows: run 34035777039 was cancelled at 244s after successful steps; ceil(244 * 1.5 / 60) = 7.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - name: Configure private Windows temp storage
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-windows-ci-temp.ps1
      # `bun build --compile` is still the binary compiler, exactly as upstream.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # The bindings depend only on these sources and the Rust compiler, and
      # rust-toolchain.toml tracks `stable`, so the key also carries the ISO week:
      # a hit skips the toolchain and the build, and every week starts from source.
      # Caches a pull request saves are scoped to it; a pull request reads main's.
      - name: Week for the native bindings cache key
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore native bindings built from these sources
        id: natives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/natives/native/*.node
          key: atomic-natives-${{ matrix.binary_platform }}-${{ steps.week.outputs.week }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'packages/natives/package.json', 'packages/natives/scripts/**') }}
      # scripts/build-binaries.sh reuses packages/natives/native/*.node when they
      # exist, as they do after a cache hit, and otherwise builds them. On a miss
      # this job needs the Rust toolchain and pays the native build itself rather
      # than waiting on agent-suite: a runner-second cost, not a wall-clock one.
      - id: rust
        if: steps.natives.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Configure Namespace dependency and Rust build cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: ${{ steps.natives.outputs.cache-hit == 'true' && 'npm' || 'npm,rust' }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      # Model data (packages/ai/src/providers/data/) is gitignored, and its only source is the upstream
      # catalogs. static-checks is the one job that fetches them live and strictly on every run, and on `main`
      # it saves what it built. Every other job restores the newest snapshot (any day) built from the same
      # generator inputs and builds offline, so a catalog outage can't fail a test shard. Only without a
      # valid snapshot does the job hydrate itself: a cold cache, or a change to the generator or provider list.
      - name: Restore model data
        id: model-data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ai/src/providers/data
          key: atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-none
          restore-keys: |
            atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-
          enableCrossOsArchive: true
      - name: Hydrate model data unless the restored snapshot is valid
        shell: bash
        run: |
          if [ -n "${{ steps.model-data.outputs.cache-matched-key }}" ] && npm run check:model-data --workspace=@bastani/pi-ai >/dev/null 2>&1; then
            echo "Using the restored model data snapshot ${{ steps.model-data.outputs.cache-matched-key }}"
          else
            echo "No valid model data snapshot; hydrating from the upstream catalogs"
            npm run hydrate:model-data
          fi
      # build-binaries.sh gets --offline-model-data below, so it doesn't regenerate the data a second time.
      - name: Build @bastani/pi-ai
        run: npm run build:offline --workspace=@bastani/pi-ai
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build
      - name: Build native release binary
        shell: bash
        run: ./scripts/build-binaries.sh --skip-install --skip-package-build --offline-model-data --platform "${{ matrix.binary_platform }}"
      - name: Smoke test Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/atomic-binary-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          tar -xzf packages/coding-agent/binaries/atomic-linux-x64.tar.gz -C "$smoke_dir"
          "$smoke_dir/atomic/atomic" --version
          bun run scripts/assert-builtin-set.ts "$smoke_dir/atomic/builtin"
          for required_path in \
            builtin/workflows/package.json \
            builtin/workflows/src/extension/index.bundle.mjs \
            builtin/subagents/package.json \
            builtin/subagents/src/extension/index.bundle.mjs \
            builtin/mcp/package.json \
            builtin/mcp/index.bundle.mjs \
            builtin/web-access/package.json \
            builtin/web-access/index.bundle.mjs \
            builtin/intercom/package.json \
            builtin/intercom/index.bundle.mjs \
            node_modules/@bastani/atomic-natives/package.json \
            node_modules/@bastani/atomic-natives/native/index.js \
            node_modules/@bastani/atomic-natives/native/atomic_natives.linux-x64-gnu.node \
            node_modules/@modelcontextprotocol/ext-apps/package.json \
            node_modules/@mozilla/readability/package.json; do
            test -f "$smoke_dir/atomic/$required_path" || {
              echo "Missing release archive path: $required_path" >&2
              exit 1
            }
          done
          # Run from a clean temp cwd so repo-local config (e.g. .mcp.json)
          # can't leak into the smoke run and hang startup.
          work_dir="$RUNNER_TEMP/atomic-binary-smoke-cwd"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          set +e
          output=$(cd "$work_dir" && printf '' | "$smoke_dir/atomic/atomic" --no-session 2>&1)
          status=$?
          set -e
          echo "$output"
          if grep -q 'Failed to load extension' <<<"$output"; then
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -Eq 'No models available|No model selected|No API key found' <<<"$output"; then
            exit "$status"
          fi
      - name: Smoke test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeDir = Join-Path $env:RUNNER_TEMP "atomic-binary-smoke"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          Expand-Archive -Path packages/coding-agent/binaries/atomic-windows-x64.zip -DestinationPath $smokeDir
          $atomic = Join-Path $smokeDir "atomic.exe"
          & $atomic --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          bun run scripts/assert-builtin-set.ts (Join-Path $smokeDir "builtin")
          foreach ($requiredPath in @(
            "builtin/workflows/package.json",
            "builtin/workflows/src/extension/index.bundle.mjs",
            "builtin/subagents/package.json",
            "builtin/subagents/src/extension/index.bundle.mjs",
            "builtin/mcp/package.json",
            "builtin/mcp/index.bundle.mjs",
            "builtin/web-access/package.json",
            "builtin/web-access/index.bundle.mjs",
            "builtin/intercom/package.json",
            "builtin/intercom/index.bundle.mjs",
            "node_modules/@bastani/atomic-natives/package.json",
            "node_modules/@bastani/atomic-natives/native/index.js",
            "node_modules/@bastani/atomic-natives/native/atomic_natives.win32-x64-msvc.node",
            "node_modules/@modelcontextprotocol/ext-apps/package.json",
            "node_modules/@mozilla/readability/package.json"
          )) {
            $archivePath = Join-Path $smokeDir $requiredPath
            if (-not (Test-Path $archivePath)) {
              throw "Missing release archive path: $requiredPath"
            }
          }
          # Run from a clean temp cwd so repo-local config (e.g. .mcp.json)
          # can't leak into the smoke run and hang startup.
          $workDir = Join-Path $env:RUNNER_TEMP "atomic-binary-smoke-cwd"
          Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $workDir | Out-Null
          Push-Location $workDir
          $output = "" | & $atomic --no-session 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($output -match "Failed to load extension") {
            exit 1
          }
          if ($status -ne 0 -and $output -notmatch "No models available|No model selected|No API key found") {
            exit $status
          }

  static-checks:
    name: static-checks (linux-x64)
    # Platform-independent checks run once on Linux. The CI project's native
    # global setup still builds a missing binding, so a cold job needs Rust.
    runs-on: namespace-profile-atomic-ci-linux-amd64-4x16;overrides.cache-tag=bastani-inc.atomic.ci.static-checks.linux-amd64
    # Run 34873678170: all steps passed, but 182s finalization hit the 3-minute cap. Add 50% headroom.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      # Still required here: packages/coding-agent's docs:check is a Bun
      # TypeScript script, and scripts/*.ts run under Bun by design.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Configure Namespace npm cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          spacectl-version: 0.12.3
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      - name: Build @bastani/pi-ai
        run: npm run build --workspace=@bastani/pi-ai
      - name: Check the generation left the committed provider shards unchanged
        id: model-data-saveable
        shell: bash
        run: |
          if git diff --quiet -- packages/ai/src; then echo "saveable=true" >> "$GITHUB_OUTPUT"; else echo "saveable=false" >> "$GITHUB_OUTPUT"; fi
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Saved only from `main`, and only when the data matches the committed shards the key hashes. Pull
      # requests restore main's snapshot and can never replace it.
      - name: Save model data snapshot
        if: github.event_name == 'push' && steps.model-data-saveable.outputs.saveable == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/ai/src/providers/data
          key: atomic-model-data-v1-${{ hashFiles('packages/ai/src/models.generated.ts', 'packages/ai/scripts/model-data.ts', 'packages/ai/scripts/generate-models.ts') }}-${{ steps.model-data-saveable.outputs.day }}
          enableCrossOsArchive: true
      - name: Check
        run: npm run check
      - name: Docs link validation
        working-directory: packages/coding-agent
        run: npm run docs:check
      - name: Mintlify docs validation
        if: github.event_name == 'pull_request'
        working-directory: packages/coding-agent/docs
        # Pinned: mintlify@4.2.732 pulls a package missing from the registry.
        # Unpin once upstream publishes a resolvable release.
        # bunx, deliberately without `--bun`, and not npx — both verified on a
        # Linux + Node 22 + Bun 1.4.0 container:
        # - `bunx --bun` re-hosts the CLI wrapper's spawned `node` child on Bun,
        #   and Bun 1.4.0 self-reports Node-compat 26.x, which trips mintlify's
        #   "not supported on node versions 25+" refusal.
        # - npx chdirs to the nearest package root (packages/coding-agent), so
        #   mintlify resolves docs.json one directory up and fails with "must be
        #   run in a directory where a docs.json file exists".
        # Plain bunx preserves this working-directory and the wrapper's `node`
        # child resolves to the Node 22 LTS this job pins above.
        timeout-minutes: 5
        run: |
          bunx mintlify@4.2.731 validate
          bunx mintlify@4.2.731 broken-links
      # pi parity: repository scripts that Node can run are tested with Node's
      # own runner rather than through the workspace suites.
      - name: Script tests
        run: npm run test:scripts
      - name: POSIX installer smoke tests in Alpine and Debian slim
        run: ./scripts/test-installers-containers.sh
      - name: Deterministic CI and release contracts
        run: npm run test:ci-contracts

  test:
    name: test (all platforms)
    needs: [unit-tests, integration-tests, agent-suite, release-archive, static-checks]
    if: always()
    runs-on: namespace-profile-atomic-ci-linux-amd64-4x16;overrides.cache-tag=bastani-inc.atomic.ci.result-gate.linux-amd64
    timeout-minutes: 1
    steps:
      - name: Require every work job to have succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ',') }}"
          echo "work job results: $results"
          if [ -z "$results" ]; then
            echo "No work job results were reported; failing closed." >&2
            exit 1
          fi
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "A required work job did not succeed: $results" >&2
              exit 1
              ;;
          esac

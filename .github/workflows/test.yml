name: Tests

env:
  PREK_DISABLE_INSTALL: "1"

permissions:
  contents: read

# Only `main` runs on push. A release/** or prerelease/** branch always reaches
# CI through its pull request (AGENTS.md, "Agent publishing requests"), so
# listing those globs here made one SHA run the entire workflow twice: two sets
# of runners competing for the same 4vCPU pool, and two competing check runs per
# required context. GitHub keeps the latest result per context name, so one
# spurious failure in the push run blocked the pull request permanently even
# though the pull_request run for that exact SHA was fully green -- runs
# 31047506585 (push, Linux `suites` cancelled on its cap) and 31047542976
# (pull_request, every job green) on sha 772a373.
#
# There is deliberately no `concurrency:` block. A group that cancels a run
# already in flight can kill a run that has published `test (...)`, leaving a
# cancelled required context on a SHA with no superseding successful run, which
# is the failure being fixed here rather than a fix for it.
on:
  push:
    branches: [main]
  pull_request:

# The work runs as four concurrent jobs instead of one sequential per-platform
# job, so the wall clock is the longest *dependent* chain rather than the sum of
# every step. Steps stay together only when one consumes another's build output:
#
#   suites          build package -> unit -> integration
#   agent-suite     build native bindings -> coding-agent vitest
#   release-archive build package -> build-binaries.sh -> archive smoke
#   static-checks   typecheck, docs, Mintlify, CI contracts (Linux)
#   test            result gate; carries the two required check contexts
#
# Nothing is passed between jobs as an artifact: waiting for a producer job
# adds a serial dependency, regardless of how cheaply its output transfers.
jobs:
  suites:
    name: suites (${{ matrix.os }}, ${{ matrix.binary_platform }})
    strategy:
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            binary_platform: linux-x64
            timeout_minutes: 28
          - os: blacksmith-4vcpu-windows-2025
            binary_platform: windows-x64
            timeout_minutes: 28
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # This job owns TWO retryable steps -- unit and integration each run behind
    # the bounded flake-retry wrapper -- so its cap must cover a replay of both,
    # not just one pass. The retry replays only those steps, so the budget is
    # `setup + 2 x (unit + integration)` rather than 2x the whole job.
    #
    # Recent observed per-step costs:
    #   run 33858796656 Windows  setup 140s, unit 475s, integration 75s
    #   run 33864468533 Windows  setup 103s, unit 511s + 494s retry,
    #                               integration >92s (41/42 files completed)
    # The remaining integration file is the structural packed-package install
    # and typecheck, so the cancelled partial duration is a lower bound rather
    # than a completed sample.
    #
    # Sizing from the pessimistic observed setup, unit, and partial integration
    # gives 140 + 2*(511 + 92) = 1346s (22.4 min). Both legs take 28 min, 1.25x
    # that lower bound and effectively the same headroom as the former 20 min
    # cap's 1.24x Windows ratio. One shared number remains deliberate: these are
    # shared 4-vCPU runners, so a per-platform split would encode precision the
    # measurements do not support and invite one leg to decay independently.
    #
    # The former 20 min cap expired after the unit retry passed and cancelled
    # integration, turning an ordinary flake into an opaque required-job
    # cancellation. This remains a hang detector, not a performance budget;
    # shortening the ~8.5 min unit step is still what would buy headroom back.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      # Sticky disks are Blacksmith-Linux-only; Windows takes a standard clone.
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        if: runner.os == 'Linux'
        with:
          # LFS fixtures are required by the coding-agent test suite.
          lfs: true
          # Full history and tags support CI contract fixtures and release tooling.
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Linux'
        with:
          lfs: true
          fetch-depth: 0
      # Bun is still a declared engine: it compiles the release binaries and runs
      # scripts/*.ts, including the flaky-suite wrapper invoked below. It no
      # longer installs dependencies or runs any suite.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to match publish.yml; `latest` cannot be cached by setup-bun.
          bun-version: 1.4.0
      # Node now installs dependencies and runs every suite, so it is required
      # here rather than only by installed-package-node-extensions.test.ts.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # packages/subagents now drives its children through the Rust control
      # plane in crates/atomic-natives, so the bundled subagent extension fails
      # to load at import without a binding. That takes the root unit and
      # integration suites down with it, not just the in-process runner tests.
      - id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      - name: Build @bastani/pi-ai
        run: npm run build --workspace=@bastani/pi-ai
      # Measured at 42s Linux / 86s Windows, both inside the existing caps.
      - name: Build native bindings for the root suites
        run: npm run build --workspace=@bastani/atomic-natives
      # Both suites below consume this build. test/unit/pi-0.82.1-artifacts.test.ts
      # silently degrades to test.skip when packages/coding-agent/dist is absent,
      # so moving the unit suite out of this job would lose coverage without
      # failing anything.
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build
      - name: Unit tests (one bounded flake retry)
        run: >-
          bun run scripts/run-flaky-test-suite.ts --label "unit tests (${{ matrix.binary_platform }})"
          --no-retry-file flaky-test-suite-runner.test.ts
          -- npm run test:unit
      - name: Integration tests (one bounded flake retry)
        run: >-
          bun run scripts/run-flaky-test-suite.ts --label "integration tests (${{ matrix.binary_platform }})"
          -- npm run test:integration
        env:
          # Hard-require the installed-package Node smoke where the package
          # build above guarantees dist/ exists on both supported hosts.
          ATOMIC_REQUIRE_INSTALLED_NODE_SMOKE: "1"
      - name: Upload flaky-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact names must be unique across every job in the run:
          # actions/upload-artifact@v4+ fails the whole run on a duplicate.
          name: test-diagnostics-suites-${{ matrix.binary_platform }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  agent-suite:
    name: agent-suite (${{ matrix.os }}, ${{ matrix.binary_platform }})
    strategy:
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            binary_platform: linux-x64
            timeout_minutes: 8
          - os: blacksmith-4vcpu-windows-2025
            binary_platform: windows-x64
            timeout_minutes: 12
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # Measured on sha 772a373: 154s / 250s in the green run 31047542976, and a
    # worst observation of 221s Linux / 270s Windows across both events on that
    # SHA; the first split run measured 138s / 349s. Linux moves 6 -> 8 min
    # (480s, 2.17x of the 221s worst observation) because 6 min had decayed to
    # 1.6x, the same drift that cancelled `suites`. Windows stays at 12 min
    # (720s), 2.06x that historical 349s observation. Current PR samples put
    # the critical path on `suites`, usually its Windows unit step. Keep these
    # retry-inclusive caps; sharding is prohibited by the testing contract.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        if: runner.os == 'Linux'
        with:
          # Package LFS assets include session fixtures and the runtime PNG.
          lfs: true
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Linux'
        with:
          lfs: true
          fetch-depth: 0
      # Bun still compiles binaries and runs scripts/*.ts, including the wrapper.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          # Required once pinned by SHA: the version otherwise comes from the ref.
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      - name: Build @bastani/pi-ai
        run: npm run build --workspace=@bastani/pi-ai
      # packages/coding-agent/test/native-binding-exports.test.ts is hard-required
      # by ATOMIC_REQUIRE_NATIVE_BINDING_SMOKE below, so the vitest suite must
      # stay behind this build.
      - name: Build native bindings for package tests
        run: npm run build --workspace=@bastani/atomic-natives
      - name: coding-agent vitest suite (one bounded flake retry)
        run: >-
          bun run scripts/run-flaky-test-suite.ts --label "coding-agent tests (${{ matrix.binary_platform }})"
          -- npm run test --workspace=@bastani/atomic
        env:
          ATOMIC_REQUIRE_NATIVE_BINDING_SMOKE: "1"
      - name: Upload flaky-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-diagnostics-agent-suite-${{ matrix.binary_platform }}
          path: .ci-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  release-archive:
    name: release-archive (${{ matrix.os }}, ${{ matrix.binary_platform }})
    strategy:
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            binary_platform: linux-x64
            timeout_minutes: 5
          - os: blacksmith-4vcpu-windows-2025
            binary_platform: windows-x64
            timeout_minutes: 9
      fail-fast: false
    runs-on: ${{ matrix.os }}
    # The warm sample measured 162s, but cold acquisition consumed 152s for
    # rust-toolchain and 71s for checkout, on top of ~110s native build and
    # ~40s archive smoke: an observed tail near 6m50s versus a healthy 4m04s.
    # Keep 9m of headroom for that cold toolchain tail.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        if: runner.os == 'Linux'
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: runner.os != 'Linux'
        with:
          lfs: true
          fetch-depth: 0
      # `bun build --compile` is still the binary compiler, exactly as upstream.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # scripts/build-binaries.sh reuses packages/natives/native/*.node when they
      # exist and otherwise builds them, so this job needs the Rust toolchain and
      # pays the native build again rather than waiting on agent-suite. That is a
      # runner-second cost, not a wall-clock one.
      - id: rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        continue-on-error: true
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Retry Rust toolchain install
        if: steps.rust.outcome == 'failure'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        timeout-minutes: 4
        with:
          toolchain: stable
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      - name: Build @bastani/pi-ai
        run: npm run build --workspace=@bastani/pi-ai
      - name: Build @bastani/atomic package
        working-directory: packages/coding-agent
        run: npm run build
      - name: Build native release binary
        shell: bash
        run: ./scripts/build-binaries.sh --skip-install --skip-package-build --platform "${{ matrix.binary_platform }}"
      - name: Smoke test Linux release archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/atomic-binary-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir"
          tar -xzf packages/coding-agent/binaries/atomic-linux-x64.tar.gz -C "$smoke_dir"
          "$smoke_dir/atomic/atomic" --version
          bun run scripts/assert-builtin-set.ts "$smoke_dir/atomic/builtin"
          for required_path in \
            builtin/workflows/package.json \
            builtin/workflows/src/extension/index.bundle.mjs \
            builtin/subagents/package.json \
            builtin/subagents/src/extension/index.bundle.mjs \
            builtin/mcp/package.json \
            builtin/mcp/index.bundle.mjs \
            builtin/web-access/package.json \
            builtin/web-access/index.bundle.mjs \
            builtin/intercom/package.json \
            builtin/intercom/index.bundle.mjs \
            node_modules/@bastani/atomic-natives/package.json \
            node_modules/@bastani/atomic-natives/native/index.js \
            node_modules/@bastani/atomic-natives/native/atomic_natives.linux-x64-gnu.node \
            node_modules/@modelcontextprotocol/ext-apps/package.json \
            node_modules/@mozilla/readability/package.json; do
            test -f "$smoke_dir/atomic/$required_path" || {
              echo "Missing release archive path: $required_path" >&2
              exit 1
            }
          done
          # Run from a clean temp cwd so repo-local config (e.g. .mcp.json)
          # can't leak into the smoke run and hang startup.
          work_dir="$RUNNER_TEMP/atomic-binary-smoke-cwd"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"
          set +e
          output=$(cd "$work_dir" && printf '' | "$smoke_dir/atomic/atomic" --no-session 2>&1)
          status=$?
          set -e
          echo "$output"
          if grep -q 'Failed to load extension' <<<"$output"; then
            exit 1
          fi
          if [ "$status" -ne 0 ] && ! grep -Eq 'No models available|No model selected|No API key found' <<<"$output"; then
            exit "$status"
          fi
      - name: Smoke test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeDir = Join-Path $env:RUNNER_TEMP "atomic-binary-smoke"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          Expand-Archive -Path packages/coding-agent/binaries/atomic-windows-x64.zip -DestinationPath $smokeDir
          $atomic = Join-Path $smokeDir "atomic.exe"
          & $atomic --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          bun run scripts/assert-builtin-set.ts (Join-Path $smokeDir "builtin")
          foreach ($requiredPath in @(
            "builtin/workflows/package.json",
            "builtin/workflows/src/extension/index.bundle.mjs",
            "builtin/subagents/package.json",
            "builtin/subagents/src/extension/index.bundle.mjs",
            "builtin/mcp/package.json",
            "builtin/mcp/index.bundle.mjs",
            "builtin/web-access/package.json",
            "builtin/web-access/index.bundle.mjs",
            "builtin/intercom/package.json",
            "builtin/intercom/index.bundle.mjs",
            "node_modules/@bastani/atomic-natives/package.json",
            "node_modules/@bastani/atomic-natives/native/index.js",
            "node_modules/@bastani/atomic-natives/native/atomic_natives.win32-x64-msvc.node",
            "node_modules/@modelcontextprotocol/ext-apps/package.json",
            "node_modules/@mozilla/readability/package.json"
          )) {
            $archivePath = Join-Path $smokeDir $requiredPath
            if (-not (Test-Path $archivePath)) {
              throw "Missing release archive path: $requiredPath"
            }
          }
          # Run from a clean temp cwd so repo-local config (e.g. .mcp.json)
          # can't leak into the smoke run and hang startup.
          $workDir = Join-Path $env:RUNNER_TEMP "atomic-binary-smoke-cwd"
          Remove-Item -Recurse -Force $workDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $workDir | Out-Null
          Push-Location $workDir
          $output = "" | & $atomic --no-session 2>&1 | Out-String
          $status = $LASTEXITCODE
          Pop-Location
          Write-Host $output
          if ($output -match "Failed to load extension") {
            exit 1
          }
          if ($status -ne 0 -and $output -notmatch "No models available|No model selected|No API key found") {
            exit $status
          }

  static-checks:
    name: static-checks (linux-x64)
    # Platform-independent checks run once on Linux. The CI project's native
    # global setup still builds a missing binding, so a cold job needs Rust.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 6
    steps:
      - uses: useblacksmith/checkout@6fd481652155169ed4d2f25ebaf97464f685175f # v1.1
        with:
          lfs: true
          fetch-depth: 0
      # Still required here: packages/coding-agent's docs:check is a Bun
      # TypeScript script, and scripts/*.ts run under Bun by design.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Alias @earendil-works/pi-ai onto the workspace package
        run: node scripts/alias-pi-ai.mjs
      - name: Build @bastani/pi-ai
        run: npm run build --workspace=@bastani/pi-ai
      - name: Check
        run: npm run check
      - name: Docs link validation
        working-directory: packages/coding-agent
        run: npm run docs:check
      - name: Mintlify docs validation
        if: github.event_name == 'pull_request'
        working-directory: packages/coding-agent/docs
        # Pinned: mintlify@4.2.732 pulls a package missing from the registry.
        # Unpin once upstream publishes a resolvable release.
        # bunx, deliberately without `--bun`, and not npx — both verified on a
        # Linux + Node 22 + Bun 1.4.0 container:
        # - `bunx --bun` re-hosts the CLI wrapper's spawned `node` child on Bun,
        #   and Bun 1.4.0 self-reports Node-compat 26.x, which trips mintlify's
        #   "not supported on node versions 25+" refusal.
        # - npx chdirs to the nearest package root (packages/coding-agent), so
        #   mintlify resolves docs.json one directory up and fails with "must be
        #   run in a directory where a docs.json file exists".
        # Plain bunx preserves this working-directory and the wrapper's `node`
        # child resolves to the Node 22 LTS this job pins above.
        timeout-minutes: 5
        run: |
          bunx mintlify@4.2.731 validate
          bunx mintlify@4.2.731 broken-links
      # pi parity: repository scripts that Node can run are tested with Node's
      # own runner rather than through the workspace suites.
      - name: Script tests
        run: npm run test:scripts
      - name: POSIX installer smoke tests in Alpine and Debian slim
        run: ./scripts/test-installers-containers.sh
      - name: Deterministic CI and release contracts
        run: npm run test:ci-contracts

  # Result gate. This job exists to carry the two contexts required by
  # repository ruleset 9310196:
  #
  #   test (blacksmith-4vcpu-ubuntu-2404, linux-x64)
  #   test (blacksmith-4vcpu-windows-2025, windows-x64)
  #
  # Its matrix reproduces those exact strings and nothing else; the gate does no
  # platform work, so both legs run on the Linux runner. `if: always()` is
  # mandatory: a job whose `needs` failed is *skipped*, and GitHub counts a
  # skipped required check as satisfied, which would turn a red suite green.
  # `needs.<job>.result` collapses a matrix to one value, so each leg asserts
  # every platform's work jobs, which is strictly stronger than the per-platform
  # meaning this context had before.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.binary_platform }})
    needs: [suites, agent-suite, release-archive, static-checks]
    if: always()
    strategy:
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            binary_platform: linux-x64
          - os: blacksmith-4vcpu-windows-2025
            binary_platform: windows-x64
      fail-fast: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every work job to have succeeded
        shell: bash
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ',') }}"
          echo "work job results: $results"
          if [ -z "$results" ]; then
            echo "No work job results were reported; failing closed." >&2
            exit 1
          fi
          case ",$results," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "A required work job did not succeed: $results" >&2
              exit 1
              ;;
          esac

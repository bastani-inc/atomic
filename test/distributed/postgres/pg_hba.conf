# Who may connect to the distributed tests' PostgreSQL servers. The security check in
# test/distributed/scenarios/security.test.ts relies on every rule here.
# TYPE     DATABASE     USER                         ADDRESS  METHOD
# The administrator, only from inside the container (docker compose exec).
local      all          postgres                              peer
# Atomic's roles and PgBouncer's lookup role, over TLS only.
hostssl    atomic       atomic_owner,atomic_runtime  all      scram-sha-256
hostssl    atomic       pgbouncer_auth               all      scram-sha-256
# The streaming replica.
hostssl    replication  replicator                   all      scram-sha-256
# Everything else, including any connection without TLS and the superuser over the network.
host       all          all                          all      reject

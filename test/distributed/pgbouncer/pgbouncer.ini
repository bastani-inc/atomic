;; PgBouncer for the distributed tests: the configuration of the PgBouncer guide
;; (packages/coding-agent/docs/storage/postgres/pgbouncer.md), with this stack's host and file locations and pools
;; sized for a few nodes on one machine.
[databases]
atomic = host=primary port=5432 dbname=atomic

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction

auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
;; Written by start-pgbouncer.sh from ADT_PGBOUNCER_AUTH_PASSWORD.
auth_file = /tmp/pgbouncer-userlist.txt

client_tls_sslmode = require
client_tls_cert_file = /adt-tls/pgbouncer.crt
client_tls_key_file = /adt-tls/pgbouncer.key

server_tls_sslmode = verify-full
server_tls_ca_file = /adt-tls/root.crt

max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 45
max_prepared_statements = 200
server_idle_timeout = 600
server_lifetime = 3600
query_wait_timeout = 120

stats_users = pgbouncer_auth
admin_users = pgbouncer_auth

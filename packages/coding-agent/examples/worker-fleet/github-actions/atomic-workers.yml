# Burst worker hosts on GitHub Actions (#4768). Copy to .github/workflows/atomic-workers.yml. `workers` fans out that
# many jobs, each running `atomic worker start --idle-exit`, which exits once no child ran for `idle-exit-ms`. Run it by
# hand for a burst, call it from another workflow, or let presets/github-actions.json dispatch it one host at a time.
#
# The database token stays in your cloud's secret manager. Each job signs in with GitHub's OIDC token (`id-token:
# write`), not a stored cloud secret, through the cloud's official action, and reads the token with that identity. Set
# the repository variables of one cloud:
#   Azure:  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_KEY_VAULT. A managed identity with a federated credential for this
#           repository, and Key Vault Secrets User on the `atomic-db-token` secret (terraform/azure-vmss).
#   AWS:    AWS_ROLE_ARN, AWS_REGION, AWS_TOKEN_SECRET_ARN. A role that trusts token.actions.githubusercontent.com for
#           this repository and may secretsmanager:GetSecretValue that secret.
#   Google: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCP_TOKEN_SECRET (projects/<p>/secrets/<name>). A
#           Workload Identity Federation provider for this repository and roles/secretmanager.secretAccessor.
# Without any of them it falls back to the repository secret ATOMIC_DB_TOKEN. Repository variable: ATOMIC_DB.
name: atomic-workers
on:
  workflow_dispatch:
    inputs:
      workers: { description: "Worker hosts to start", type: number, default: 1 }
      idle-exit-ms: { description: "Exit after this long with no child", type: number, default: 300000 }
  workflow_call:
    inputs:
      workers: { type: number, default: 1 }
      idle-exit-ms: { type: number, default: 300000 }
    secrets:
      ATOMIC_DB_TOKEN: { required: false }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts.outputs.hosts }}
    steps:
      - id: hosts
        env:
          WORKERS: ${{ inputs.workers }}
        run: echo "hosts=$(jq -cn --argjson n "$WORKERS" '[range($n)]')" >> "$GITHUB_OUTPUT"
  worker:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      # GitHub's OIDC token, for the cloud sign-in below.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plan.outputs.hosts) }}
    steps:
      # Check out your workflow definitions, if roots do not bind their children to a workspace.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @bastani/atomic && atomic install npm:@bastani/atomic-storage-libsql
      - if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v2
      - name: Write the database token to a file only this job reads
        env:
          AZURE_KEY_VAULT: ${{ vars.AZURE_KEY_VAULT }}
          AWS_TOKEN_SECRET_ARN: ${{ vars.AWS_TOKEN_SECRET_ARN }}
          GCP_TOKEN_SECRET: ${{ vars.GCP_TOKEN_SECRET }}
          ATOMIC_DB_TOKEN: ${{ secrets.ATOMIC_DB_TOKEN }}
        run: |
          umask 077
          file="$RUNNER_TEMP/atomic-db-token"
          if [ -n "$AZURE_KEY_VAULT" ]; then
            az keyvault secret show --vault-name "$AZURE_KEY_VAULT" --name atomic-db-token --query value --output tsv > "$file"
          elif [ -n "$AWS_TOKEN_SECRET_ARN" ]; then
            aws secretsmanager get-secret-value --secret-id "$AWS_TOKEN_SECRET_ARN" --query SecretString --output text > "$file"
          elif [ -n "$GCP_TOKEN_SECRET" ]; then
            gcloud secrets versions access latest --secret="$GCP_TOKEN_SECRET" > "$file"
          else
            printf '%s' "$ATOMIC_DB_TOKEN" > "$file"
          fi
      - name: Serve until idle
        env:
          ATOMIC_DB: ${{ vars.ATOMIC_DB }}
          # One run per host when the preset dispatches it; the controller matches the host by its run id.
          ATOMIC_PROVIDER_ID: ${{ inputs.workers == 1 && github.run_id || format('{0}-{1}', github.run_id, matrix.host) }}
          IDLE_EXIT_MS: ${{ inputs.idle-exit-ms }}
        run: |
          exec atomic worker start --db "$ATOMIC_DB" --token-file "$RUNNER_TEMP/atomic-db-token" \
            --slots 2 --idle-exit "$IDLE_EXIT_MS"

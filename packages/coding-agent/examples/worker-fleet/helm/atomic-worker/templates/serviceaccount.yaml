# The worker and metrics pods' identity (#4768). Annotate it for workload identity when a pod reads a secret manager.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}"
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if .Values.controllerRbac }}
---
# `atomic worker controller` with presets/kubernetes.json: only what the preset's kubectl commands need, on this
# release's worker Deployment and pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ .Release.Name }}-controller"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ .Release.Name }}-controller"
rules:
  # Pod names are not known in advance, so `resourceNames` cannot narrow this: keep the release in its own namespace.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: ["{{ .Release.Name }}"]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: ["{{ .Release.Name }}"]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Release.Name }}-controller"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ .Release.Name }}-controller"
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-controller"
    namespace: "{{ .Release.Namespace }}"
{{- end }}

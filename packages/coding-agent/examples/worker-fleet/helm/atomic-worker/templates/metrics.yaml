# `atomic worker metrics`: the scaling signal for KEDA and Prometheus. It reads the database and writes nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-metrics"
  labels:
    app: "{{ .Release.Name }}-metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-metrics"
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: token
          image: busybox:1.36
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          command:
            - sh
            - -c
            - install -o 1000 -g 1000 -m 600 /secret/token /run/secrets/atomic-db-token
          volumeMounts:
            - name: token-secret
              mountPath: /secret
              readOnly: true
            - name: token
              mountPath: /run/secrets
      containers:
        - name: metrics
          image: "{{ .Values.image }}"
          command: ["atomic", "worker", "metrics"]
          args:
            - --listen
            - 0.0.0.0:9464
            - --db
            - "{{ .Values.database }}"
            - --token-file
            - /run/secrets/atomic-db-token
            - --workers-per-host
            - "{{ .Values.workersPerHost }}"
            - --max-hosts
            - "{{ .Values.maxHosts }}"
          ports:
            - name: metrics
              containerPort: 9464
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          volumeMounts:
            - name: token
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: token-secret
          secret:
            secretName: "{{ .Values.tokenSecret }}"
            defaultMode: 0400
        # The token, copied for the container's user (node, uid 1000) with mode 600: a Secret volume's files are root's.
        - name: token
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-metrics"
spec:
  selector:
    app: "{{ .Release.Name }}-metrics"
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics

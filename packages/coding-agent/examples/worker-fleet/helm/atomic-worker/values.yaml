# The worker image built from ../../Dockerfile.
image: registry.example.com/atomic-worker:latest
# The shared database: a PostgreSQL URL (user name, no password), or a libSQL / Turso URL. Build the image with the
# matching storage adapter.
database: postgresql://atomic@atomic-pool.postgres.database.azure.com:5432/atomic?sslmode=verify-full
# Or name a Secret holding the URL under the key `url`, created outside this chart; it takes precedence over `database`.
databaseSecret: ""
# A Secret holding the database password (PostgreSQL) or token (libSQL) under the key `token`, created outside this chart.
tokenSecret: atomic-db-token
# Children each worker pod runs at once; the scaling signal assumes the same number.
workersPerHost: 4
maxHosts: 20
# How long a scaled-in pod may take to finish its children: your longest child step.
drainSeconds: 900
# How long the fleet stays above what it needs before KEDA scales in (the controller's idleDrainMs).
scaleDownStabilizationSeconds: 300
resources:
  requests: { cpu: "2", memory: 4Gi }

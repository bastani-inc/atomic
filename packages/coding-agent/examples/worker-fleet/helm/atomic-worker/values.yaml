# The worker image built from ../../Dockerfile.
image: registry.example.com/atomic-worker:latest
# The shared database: a PostgreSQL URL (user name, no password), or a libSQL / Turso URL. Build the image with the
# matching storage adapter.
database: postgresql://atomic@atomic-pool.postgres.database.azure.com:5432/atomic
# Or name a Secret holding the URL under the key `url`, created outside this chart; it takes precedence over `database`.
databaseSecret: ""
# A Secret holding the database password (PostgreSQL) or token (libSQL) under the key `token`, created outside this chart: synced from your secret
# manager by the External Secrets Operator, or by the Secrets Store CSI driver's secretObjects. Never bake it into the image.
tokenSecret: atomic-db-token
# Or mount the token straight from your secret manager through this SecretProviderClass of the Secrets Store CSI driver
# (Azure Key Vault, AWS Secrets Manager or Google Secret Manager provider), whose object is named `token`. It reads the
# secret with the pods' ServiceAccount below.
tokenSecretProviderClass: ""
# The ServiceAccount the worker and metrics pods run as. Its token is not mounted: Atomic calls no Kubernetes API.
serviceAccount:
  # Workload identity for a secret manager, when you use one, for example:
  #   azure.workload.identity/client-id: <client id>      (AKS Workload Identity; also set podLabels)
  #   eks.amazonaws.com/role-arn: <role ARN>              (EKS IRSA; EKS Pod Identity needs no annotation)
  #   iam.gke.io/gcp-service-account: <GSA email>         (GKE Workload Identity Federation)
  annotations: {}
# Labels for the worker and metrics pods, such as azure.workload.identity/use: "true" for AKS Workload Identity.
podLabels: {}
# Scale with `atomic worker controller` and presets/kubernetes.json instead of KEDA: the chart leaves out the
# ScaledObject and adds a ServiceAccount, Role and RoleBinding. Run the controller in a pod with serviceAccountName
# <release>-controller, and kubectl uses its in-cluster token. Install the release in its own namespace: a Role cannot
# limit `patch` on pods to this Deployment's pods, since their names are not known in advance.
controllerRbac: false
# Children each worker pod runs at once; the scaling signal assumes the same number.
workersPerHost: 4
maxHosts: 20
# How long a scaled-in pod may take to finish its children: your longest child step.
drainSeconds: 900
# How long the fleet stays above what it needs before KEDA scales in (the controller's idleDrainMs).
scaleDownStabilizationSeconds: 300
resources:
  requests: { cpu: "2", memory: 4Gi }
